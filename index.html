  // parent/child/spouse links) between them — handy once the tree is big
  // enough that the connection between two distant people isn't obvious
  // just by looking. Describes the path as a plain step-by-step chain
  // (spouse/parent/child) rather than a precise kinship term (cousin,
  // great-uncle, etc.) since the app doesn't record gender and getting
  // Bulgarian kinship terms grammatically right without it isn't reliable.

  let relPathIds = [];

  function relationNeighbors(id) {
    const p = byId(id);
    if (!p) return [];
    const neighbors = [...p.parents];
    if (p.spouse) neighbors.push(p.spouse);
    for (const q of people) {
      if (q.parents.includes(id)) neighbors.push(q.id);
    }
    return neighbors;
  }

  function findRelationshipPath(aId, bId) {
    if (aId === bId) return [aId];
    const visited = new Set([aId]);
    const queue = [[aId]];
    while (queue.length) {
      const path = queue.shift();
      const last = path[path.length - 1];
      for (const n of relationNeighbors(last)) {
        if (visited.has(n)) continue;
        if (n === bId) return [...path, n];
        visited.add(n);
        queue.push([...path, n]);
      }
    }
    return null;
  }

  function relationLabel(uId, vId) {
    const u = byId(uId), v = byId(vId);
    if (!u || !v) return "";
    if (u.spouse === vId) return t("relSpouse");
    if (u.parents.includes(vId)) return t("relParent"); // v is u's parent
    if (v.parents.includes(uId)) return t("relChild"); // v is u's child
    return "";
  }

  function describeRelationshipPath(pathIds) {
    const parts = [byId(pathIds[0])?.name || "?"];
    for (let i = 0; i < pathIds.length - 1; i++) {
      parts.push(`(${relationLabel(pathIds[i], pathIds[i + 1])})`);
      parts.push(byId(pathIds[i + 1])?.name || "?");
    }
    return parts.join(" → ");
  }

  function highlightRelationshipPath(pathIds) {
    clearLineHighlight();
    document.querySelectorAll(".person.rel-path").forEach(el => el.classList.remove("rel-path"));
    const svg = document.querySelector("#treeInner svg");
    if (svg) {
      const edges = [];
      for (let i = 0; i < pathIds.length - 1; i++) edges.push([pathIds[i], pathIds[i + 1]]);
      svg.querySelectorAll("line").forEach((l) => {
        const ids = (l.getAttribute("data-people") || "").split(" ");
        const onPath = edges.some(([a, b]) => ids.includes(a) && ids.includes(b));
        l.style.opacity = onPath ? "1" : "0.12";
      });
    }
    pathIds.forEach((id) => {
      const el = document.querySelector(`.person[data-person-id="${id}"]`);
      if (el) el.classList.add("rel-path");
    });
  }

  function clearRelationshipHighlight() {
    clearLineHighlight();
    document.querySelectorAll(".person.rel-path").forEach(el => el.classList.remove("rel-path"));
  }

  // Re-applies the current path's highlight after every render() (which
  // rebuilds every .person element and SVG line from scratch) — mirrors
  // reapplySearchHighlight. Drops the path if either person no longer exists.
  function reapplyRelationshipHighlight() {
    if (relPathIds.length === 0) return;
    if (relPathIds.some(id => !byId(id))) {
      relPathIds = [];
      document.getElementById("relResult").hidden = true;
      document.getElementById("relClearBtn").hidden = true;
      return;
    }
    highlightRelationshipPath(relPathIds);
  }

  function refreshRelSelects() {
    const sortedPeople = [...people].sort((a, b) => a.name.localeCompare(b.name, lang));
    for (const selectId of ["relPersonA", "relPersonB"]) {
      const select = document.getElementById(selectId);
      const current = select.value;
      const placeholderKey = selectId === "relPersonA" ? "relPersonAPlaceholder" : "relPersonBPlaceholder";
      select.innerHTML = `<option value="">${escapeHtml(t(placeholderKey))}</option>`;
      for (const p of sortedPeople) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      }
      if (people.some(p => p.id === current)) select.value = current;
    }
  }

  function showRelResult(message, isError) {
    const resultEl = document.getElementById("relResult");
    resultEl.hidden = false;
    resultEl.textContent = message;
    resultEl.classList.toggle("no-path", !!isError);
  }

  document.getElementById("relFindBtn").addEventListener("click", () => {
    const aId = document.getElementById("relPersonA").value;
    const bId = document.getElementById("relPersonB").value;
    if (!aId || !bId) { showRelResult(t("relSelectBoth"), true); return; }
    if (aId === bId) {
      relPathIds = [];
      clearRelationshipHighlight();
      document.getElementById("relClearBtn").hidden = true;
      showRelResult(t("relSamePerson"), true);
      return;
    }
    const path = findRelationshipPath(aId, bId);
    if (!path) {
      relPathIds = [];
      clearRelationshipHighlight();
      document.getElementById("relClearBtn").hidden = true;
      showRelResult(t("relNoPath"), true);
      return;
    }
    relPathIds = path;
    document.getElementById("relClearBtn").hidden = false;
    showRelResult(describeRelationshipPath(path), false);
    highlightRelationshipPath(path);
    const firstEl = document.querySelector(`.person[data-person-id="${path[0]}"]`);
    if (firstEl) firstEl.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
  });

  document.getElementById("relClearBtn").addEventListener("click", () => {
    relPathIds = [];
    clearRelationshipHighlight();
    document.getElementById("relResult").hidden = true;
    document.getElementById("relClearBtn").hidden = true;
    document.getElementById("relPersonA").value = "";
    document.getElementById("relPersonB").value = "";
  });

  for (const selectId of ["relPersonA", "relPersonB"]) {
    setupTypeAhead(document.getElementById(selectId));
  }

  // --- Person info popup --------------------------------------------
  // Shows the details that don't fit on the card itself (full name if
  // truncated, parents, spouse) — on hover for mouse/trackpad users, or on
  // tap for touch devices, which have no hover to reveal it passively.

  function hoverCapable() {
    return window.matchMedia && window.matchMedia("(hover: hover)").matches;
  }

  let infoPersonId = null;

  // Dims every connector line except the ones touching this person (tagged
  // with their id via `data-people` when drawn — see line() in render()),
  // so their own connections stand out without needing a fixed color per
  // family, which runs out of visually distinct colors on a large tree.
  function highlightPersonConnections(id) {
    const svg = document.querySelector("#treeInner svg");
    if (!svg) return;
    svg.querySelectorAll("line").forEach((l) => {
      const ids = (l.getAttribute("data-people") || "").split(" ");
      l.style.opacity = ids.includes(id) ? "1" : "0.15";
    });
  }

  function clearLineHighlight() {
    const svg = document.querySelector("#treeInner svg");
    if (!svg) return;
    svg.querySelectorAll("line").forEach((l) => { l.style.opacity = ""; });
  }

  function showPersonInfo(id, anchorEl) {
    const person = byId(id);
    if (!person) return;
    infoPersonId = id;
    highlightPersonConnections(id);

    document.getElementById("infoName").textContent = person.name;

    document.getElementById("infoOrigin").hidden = !person.origin;
    document.getElementById("infoOriginValue").textContent = person.origin || "";

    const bornText = formatDate(person.birth);
    document.getElementById("infoBorn").hidden = !bornText;
    document.getElementById("infoBornValue").textContent = bornText;

    const diedText = formatDate(person.death);
    document.getElementById("infoDied").hidden = !diedText;
    document.getElementById("infoDiedValue").textContent = diedText;

    const age = calculateAge(person.birth, person.death);
    document.getElementById("infoAge").hidden = age === null;
    document.getElementById("infoAgeLabelText").textContent = t(person.death ? "infoAgeAtDeathLabel" : "infoAgeLabel");
    document.getElementById("infoAgeValue").textContent = age === null ? "" : (person.death ? t("livedYears", { age }) : String(age));

    const parentNames = person.parents.map(pid => byId(pid)?.name).filter(Boolean);
    document.getElementById("infoParents").hidden = parentNames.length === 0;
    document.getElementById("infoParentsValue").textContent = parentNames.join(", ");

    const spouseName = person.spouse ? byId(person.spouse)?.name : null;
    document.getElementById("infoSpouse").hidden = !spouseName;
    document.getElementById("infoSpouseValue").textContent = spouseName || "";

    const children = people.filter(c => c.parents.includes(person.id));
    document.getElementById("infoChildren").hidden = children.length === 0;
    document.getElementById("infoChildrenValue").textContent = children.length
      ? `${children.length} — ${children.map(c => c.name).join(", ")}`
      : "";

    const popup = document.getElementById("personInfoPopup");
    popup.hidden = false; // unhide first so offsetHeight below reflects real content
    const rect = anchorEl.getBoundingClientRect();
    const popupWidth = Math.min(220, document.documentElement.clientWidth - 16);
    const margin = 8;
    let left = rect.left + window.scrollX;
    const maxLeft = window.scrollX + document.documentElement.clientWidth - popupWidth - margin;
    left = Math.max(window.scrollX + margin, Math.min(left, maxLeft));
    popup.style.left = left + "px";

    // Always show above the card so the tree structure (children/descendants)
    // below stays visible; fall back to below only when there isn't room above.
    const popupHeight = popup.offsetHeight;
    const top = (rect.top > popupHeight + margin)
      ? rect.top + window.scrollY - popupHeight - 4
      : rect.bottom + window.scrollY + 4;
    popup.style.top = top + "px";
  }

  function hidePersonInfo() {
    infoPersonId = null;
    document.getElementById("personInfoPopup").hidden = true;
    clearLineHighlight();
    // clearLineHighlight() resets EVERY line back to fully visible, which
    // would silently wipe out an active relationship-path highlight the
    // moment the person just hovers/taps any card afterward — restore it
    // right after, same as render() does.
    reapplyRelationshipHighlight();
  }

  // A brief grace period on mouseleave — without it, moving the cursor from
  // the card to the popup (two separate elements, with a gap between them)
  // fires the card's mouseleave and hides the popup before the cursor ever
  // reaches it, making the Edit button inside unreachable by mouse.
  let infoHideTimer = null;
  function scheduleHidePersonInfo() {
    clearTimeout(infoHideTimer);
    infoHideTimer = setTimeout(hidePersonInfo, 200);
  }
  function cancelHidePersonInfo() {
    clearTimeout(infoHideTimer);
  }

  document.getElementById("infoEditBtn").addEventListener("click", () => {
    if (infoPersonId) startEdit(infoPersonId);
    hidePersonInfo();
  });
  document.getElementById("personInfoPopup").addEventListener("click", (e) => e.stopPropagation());
  document.getElementById("personInfoPopup").addEventListener("mouseenter", cancelHidePersonInfo);
  document.getElementById("personInfoPopup").addEventListener("mouseleave", scheduleHidePersonInfo);

  document.addEventListener("click", (e) => {
    const popup = document.getElementById("personInfoPopup");
    if (!popup.hidden && !popup.contains(e.target) && !e.target.closest(".person")) {
      hidePersonInfo();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !document.getElementById("personInfoPopup").hidden) hidePersonInfo();
  });

  // All of a person's descendants (children, grandchildren, ...) — used to
  // keep the Parent dropdowns from offering a choice that would make that
  // person their own ancestor (a cycle the generation-layout math can't
  // meaningfully lay out).
  function descendantsOf(personId) {
    const result = new Set();
    const stack = [personId];
    while (stack.length) {
      const current = stack.pop();
      for (const child of people) {
        if (child.parents.includes(current) && !result.has(child.id)) {
          result.add(child.id);
          stack.push(child.id);
        }
      }
    }
    return result;
  }

  function refreshDropdowns() {
    const blockedAsParent = editingId ? descendantsOf(editingId) : new Set();
    // Alphabetical by name (locale-aware, so Cyrillic sorts correctly too)
    // rather than insertion order — makes a long dropdown actually
    // scannable instead of listing people in whatever order they happened
    // to be added.
    const sortedPeople = [...people].sort((a, b) => a.name.localeCompare(b.name, lang));
    for (const selectId of ["fParent1", "fParent2", "fSpouse"]) {
      const select = document.getElementById(selectId);
      const current = select.value;
      const isParentField = selectId === "fParent1" || selectId === "fParent2";
      select.innerHTML = `<option value="">${escapeHtml(t("none"))}</option>`;
      for (const p of sortedPeople) {
        if (p.id === editingId) continue; // a person can't be their own parent/spouse
        if (isParentField && blockedAsParent.has(p.id)) continue; // would make editingId their own ancestor
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.appendChild(opt);
      }
      if (people.some(p => p.id === current) && !(isParentField && blockedAsParent.has(current))) select.value = current;
    }
  }

  // Custom type-ahead for the parent/spouse <select> elements: native
  // browser type-ahead is inconsistent across browsers, so we implement it
  // ourselves — typed letters accumulate into a buffer (reset after a short
  // pause) and jump the select to the first alphabetically-sorted option
  // (already sorted by refreshDropdowns) whose name starts with that buffer.
  function setupTypeAhead(select) {
    let buffer = "";
    let resetTimer = null;
    select.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return; // ignore Tab, Arrow keys, Enter, etc.
      clearTimeout(resetTimer);
      buffer += e.key.toLowerCase();
      resetTimer = setTimeout(() => { buffer = ""; }, 800);
      const match = [...select.options].find(
        (opt) => opt.value && opt.textContent.toLowerCase().startsWith(buffer)
      );
      if (match) {
        select.value = match.value;
        e.preventDefault();
      }
    });
  }

  // Escapes for safe use in BOTH HTML text content and quoted attribute
  // values (e.g. title="${escapeHtml(name)}") — a name/value containing a
  // literal " would otherwise break out of the attribute and let arbitrary
  // attributes (onmouseover=, etc.) be injected via imported/edited data.
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  }

  // A stable color per distinct parent-set, derived from a hash of their
  // ids (not draw order), so the same family always gets the same color
  // across re-renders/reloads — two different families' connector lines
  // stay visually distinguishable at a glance even when they run close
  // together or cross, without having to hover to tell them apart.
  function familyLineColor(parentIds) {
    const key = [...parentIds].sort().join("|");
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    const hue = hash % 360;
    return `hsl(${hue}, ${theme === "light" ? 48 : 55}%, ${theme === "light" ? 38 : 58}%)`;
  }

  // Dates are stored as "YYYY-MM-DD", or "YYYY-MM"/"YYYY" alone when the day
  // (or day+month) is unknown — genealogy often only has a birth year.
  // Shown on cards as "12 May 1958", "May 1958", or just "1958".
  function formatDate(value) {
    if (!value) return "";
    const months = t("months");
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (m) return `${parseInt(m[3], 10)} ${months[parseInt(m[2], 10) - 1]} ${m[1]}`;
    m = /^(\d{4})-(\d{2})$/.exec(value);
    if (m) return `${months[parseInt(m[2], 10) - 1]} ${m[1]}`;
    m = /^(\d{4})$/.exec(value);
    if (m) return m[1];
    return value;
  }

  function parseDateParts(value) {
    if (!value) return null;
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    if (m) return { year: +m[1], month: +m[2], day: +m[3] };
    m = /^(\d{4})-(\d{2})$/.exec(value);
    if (m) return { year: +m[1], month: +m[2], day: null };
    m = /^(\d{4})$/.exec(value);
    if (m) return { year: +m[1], month: null, day: null };
    return null;
  }

  // Age in whole years, at death if known, otherwise as of today. Falls
  // back to a year-only estimate when the birth (or reference) date is
  // missing its month/day — common for older ancestors.
  function calculateAge(birthValue, deathValue) {
    const birth = parseDateParts(birthValue);
    if (!birth) return null;

    let end;
    if (deathValue) {
      end = parseDateParts(deathValue);
      if (!end) return null;
    } else {
      const now = new Date();
      end = { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
    }

    let age = end.year - birth.year;
    if (birth.month && end.month) {
      const birthdayNotYetReached = end.month < birth.month ||
        (end.month === birth.month && birth.day && end.day && end.day < birth.day);
      if (birthdayNotYetReached) age--;
    }
    return age >= 0 ? age : null;
  }

  // --- Calendar popup ----------------------------------------------------
  // A small custom day-grid picker (Day-Month-Year header, always in that
  // order) shared by both the Born and Died fields — opened against
  // whichever one was clicked, closed on a pick, outside click, or Escape.

  const popup = document.getElementById("datePopup");
  const dpMonthSelect = document.getElementById("dpMonth");
  const dpYearInput = document.getElementById("dpYear");
  const dpGrid = document.getElementById("dpGrid");

  let activeField = null; // "birth" | "death"
  let viewYear, viewMonth; // 1-based month

  function fieldIds(field) {
    return field === "birth"
      ? { display: "fBirthInput", hidden: "fBirthValue" }
      : { display: "fDeathInput", hidden: "fDeathValue" };
  }

  function openPopup(field, anchor) {
    activeField = field;
    const ids = fieldIds(field);
    const parsed = parseDateParts(document.getElementById(ids.hidden).value);
    const now = new Date();
    viewYear = parsed ? parsed.year : now.getFullYear();
    viewMonth = parsed && parsed.month ? parsed.month : now.getMonth() + 1;

    const rect = anchor.getBoundingClientRect();
    const popupWidth = Math.min(260, document.documentElement.clientWidth - 16); // matches .date-popup's CSS width/max-width
    const margin = 8;
    let left = rect.left + window.scrollX;
    const maxLeft = window.scrollX + document.documentElement.clientWidth - popupWidth - margin;
    left = Math.max(window.scrollX + margin, Math.min(left, maxLeft));
    popup.style.left = left + "px";
    popup.style.top = (rect.bottom + window.scrollY + 4) + "px";
    popup.hidden = false;
    renderPopup(parsed);
  }

  function closePopup() {
    popup.hidden = true;
    activeField = null;
  }

  function renderPopup(selected) {
    dpMonthSelect.value = String(viewMonth);
    dpYearInput.value = String(viewYear);

    dpGrid.innerHTML = "";
    const firstOfMonth = new Date(viewYear, viewMonth - 1, 1);
    const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
    // Monday-first weekday index (0=Mon .. 6=Sun) for the 1st of the month.
    const leadBlanks = (firstOfMonth.getDay() + 6) % 7;
    const daysInPrevMonth = new Date(viewYear, viewMonth - 1, 0).getDate();

    const today = new Date();
    const cells = [];
    for (let i = leadBlanks; i > 0; i--) cells.push({ day: daysInPrevMonth - i + 1, outside: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, outside: false });
    while (cells.length % 7 !== 0 || cells.length < 42) {
      const nextIdx = cells.length - (leadBlanks + daysInMonth) + 1;
      cells.push({ day: nextIdx, outside: true });
      if (cells.length >= 42) break;
    }

    for (const cell of cells) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = cell.day;
      if (cell.outside) btn.classList.add("dp-outside");
      const isToday = !cell.outside && viewYear === today.getFullYear() && viewMonth === today.getMonth() + 1 && cell.day === today.getDate();
      if (isToday) btn.classList.add("dp-today");
      const isSelected = selected && !cell.outside && selected.day === cell.day && selected.month === viewMonth && selected.year === viewYear;
      if (isSelected) btn.classList.add("dp-selected");
      if (!cell.outside) {
        btn.addEventListener("click", () => pickDay(cell.day));
      } else {
        btn.disabled = true;
      }
      dpGrid.appendChild(btn);
    }
  }

  function pickDay(day) {
    const ids = fieldIds(activeField);
    const iso = `${viewYear}-${String(viewMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    document.getElementById(ids.hidden).value = iso;
    document.getElementById(ids.display).value = formatDate(iso);
    closePopup();
  }

  document.getElementById("dpPrev").addEventListener("click", () => {
    viewMonth--;
    if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    renderPopup(parseDateParts(document.getElementById(fieldIds(activeField).hidden).value));
  });
  document.getElementById("dpNext").addEventListener("click", () => {
    viewMonth++;
    if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    renderPopup(parseDateParts(document.getElementById(fieldIds(activeField).hidden).value));
  });
  dpMonthSelect.addEventListener("change", () => {
    viewMonth = parseInt(dpMonthSelect.value, 10);
    renderPopup(parseDateParts(document.getElementById(fieldIds(activeField).hidden).value));
  });
  dpYearInput.addEventListener("change", () => {
    if (dpYearInput.value) viewYear = parseInt(dpYearInput.value, 10);
    renderPopup(parseDateParts(document.getElementById(fieldIds(activeField).hidden).value));
  });

  document.getElementById("dpYearOnly").addEventListener("click", () => {
    if (!dpYearInput.value) return;
    const ids = fieldIds(activeField);
    const year = dpYearInput.value;
    document.getElementById(ids.hidden).value = year;
    document.getElementById(ids.display).value = formatDate(year);
    closePopup();
  });
  document.getElementById("dpClear").addEventListener("click", () => {
    const ids = fieldIds(activeField);
    document.getElementById(ids.hidden).value = "";
    document.getElementById(ids.display).value = "";
    closePopup();
  });

  document.getElementById("fBirthInput").addEventListener("click", (e) => openPopup("birth", e.target));
  document.getElementById("fDeathInput").addEventListener("click", (e) => openPopup("death", e.target));

  document.addEventListener("click", (e) => {
    if (!popup.hidden && !popup.contains(e.target) && e.target.id !== "fBirthInput" && e.target.id !== "fDeathInput") {
      closePopup();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !popup.hidden) closePopup();
  });

  // Downscales a chosen photo to a small square-ish thumbnail (longest side
  // capped at PHOTO_MAX_SIZE) and returns it as a JPEG data URL — keeps
  // localStorage usage reasonable even with several photos in the tree.
  function resizeImage(file, maxSize) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height) {
            if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
          } else {
            if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // --- Photo preview & face-centering ------------------------------------
  // The resized thumbnail is shown full-size in the form so the person can
  // click on it to pick which point stays centered when it's later cropped
  // into the small round card avatar (object-position, applied in render()).

  let currentPhotoDataUrl = null;
  let currentPhotoFocus = { x: 50, y: 50 };

  function setPhotoFocusMarker(x, y) {
    const marker = document.getElementById("photoFocusMarker");
    marker.style.left = x + "%";
    marker.style.top = y + "%";
  }

  function showPhotoPreview(dataUrl, focus) {
    currentPhotoDataUrl = dataUrl;
    currentPhotoFocus = focus || { x: 50, y: 50 };
    document.getElementById("photoPreviewImg").src = dataUrl;
    setPhotoFocusMarker(currentPhotoFocus.x, currentPhotoFocus.y);
    document.getElementById("photoPreviewWrap").hidden = false;
  }

  function hidePhotoPreview() {
    currentPhotoDataUrl = null;
    currentPhotoFocus = { x: 50, y: 50 };
    document.getElementById("photoPreviewImg").src = "";
    document.getElementById("photoPreviewWrap").hidden = true;
  }

  document.getElementById("photoPreviewImg").addEventListener("click", (e) => {
    const rect = e.target.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
    const y = Math.max(0, Math.min(100, Math.round(((e.clientY - rect.top) / rect.height) * 100)));
    currentPhotoFocus = { x, y };
    setPhotoFocusMarker(x, y);
  });

  // --- Edit mode -----------------------------------------------------
  // Clicking a card loads that person's details back into the same form
  // used to add people; submitting then updates them in place instead of
  // creating a new entry.

  function startEdit(id) {
    const person = byId(id);
    if (!person) return;
    editingId = id;

    document.getElementById("fName").value = person.name;
    document.getElementById("fOrigin").value = person.origin || "";
    document.getElementById("fBirthValue").value = person.birth || "";
    document.getElementById("fBirthInput").value = formatDate(person.birth);
    document.getElementById("fDeathValue").value = person.death || "";
    document.getElementById("fDeathInput").value = formatDate(person.death);
    document.getElementById("fPhoto").value = ""; // can't pre-fill a file input — leaving it blank keeps the existing photo
    if (person.photo) showPhotoPreview(person.photo, person.photoFocus);
    else hidePhotoPreview();

    document.getElementById("fParent1").value = person.parents[0] || "";
    document.getElementById("fParent2").value = person.parents[1] || "";
    document.getElementById("fSpouse").value = person.spouse || "";

    document.getElementById("submitBtn").textContent = t("saveChanges");
    document.getElementById("cancelEditBtn").hidden = false;

    render(); // refreshes dropdowns (excluding this person) and highlights their card
    document.getElementById("addForm").scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("fName").focus();
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById("addForm").reset();
    hidePhotoPreview();
    document.getElementById("submitBtn").textContent = t("addPerson");
    document.getElementById("cancelEditBtn").hidden = true;
    render();
  }

  document.getElementById("cancelEditBtn").addEventListener("click", cancelEdit);

  document.getElementById("fPhotoBtn").addEventListener("click", () => document.getElementById("fPhoto").click());
  document.getElementById("photoRemoveBtn").addEventListener("click", () => {
    if (!confirm(t("confirmRemovePhoto"))) return;
    document.getElementById("fPhoto").value = "";
    hidePhotoPreview();
  });

  document.getElementById("fPhoto").addEventListener("change", async () => {
    const input = document.getElementById("fPhoto");
    const file = input.files && input.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert(t("alertInvalidPhotoType"));
      input.value = "";
      return;
    }
    if (file.size > MAX_PHOTO_BYTES) {
      alert(t("alertPhotoTooLarge", { mb: Math.round(MAX_PHOTO_BYTES / (1024 * 1024)) }));
      input.value = "";
      return;
    }

    try {
      const dataUrl = await resizeImage(file, PHOTO_MAX_SIZE);
      showPhotoPreview(dataUrl, { x: 50, y: 50 });
    } catch {
      alert(t("alertPhotoReadError")); // a broken/unreadable image just means no photo, not a failed add
      input.value = "";
      hidePhotoPreview();
    }
  });

  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("fName").value;
    if (!name.trim()) return;

    const data = {
      name,
      origin: document.getElementById("fOrigin").value,
      photo: currentPhotoDataUrl,
      photoFocus: currentPhotoFocus,
      birth: document.getElementById("fBirthValue").value,
      death: document.getElementById("fDeathValue").value,
      parent1: document.getElementById("fParent1").value,
      parent2: document.getElementById("fParent2").value,
      spouse: document.getElementById("fSpouse").value,
    };

    if (editingId) {
      updatePerson(editingId, data);
      cancelEdit();
    } else {
      addPerson(data);
      e.target.reset();
      hidePhotoPreview();
      document.getElementById("fName").focus();
    }
  });

  document.getElementById("clearAllBtn").addEventListener("click", clearAll);

  document.getElementById("undoBtn").addEventListener("click", () => {
    if (!undoSnapshot) return;
    clearTimeout(undoHideTimer);
    people = undoSnapshot;
    undoSnapshot = null;
    document.getElementById("undoBanner").hidden = true;
    save();
    render();
  });
  document.getElementById("printBtn").addEventListener("click", printTree);

  // The tree can easily be wider or taller than a single printed page —
  // #treeInner's on-screen zoom (applyZoom) only ever fits it to the
  // browser viewport, not to paper. Shrink it to fit one page right
  // before printing, then restore the normal on-screen zoom afterward.
  //
  // This deliberately uses the CSS `zoom` property instead of the
  // `transform: scale()` applyZoom() normally uses on screen. A
  // transform is purely visual — it does NOT shrink the element's
  // contribution to the page's layout/flow, so the print engine still
  // paginates as if the tree were full size and just visually renders it
  // smaller, which is exactly what was cutting the print job across
  // multiple pages and clipping the last one. `zoom` actually reflows
  // the box at the scaled size, so the browser paginates correctly.
  // (Supported in Chromium/Safari-based browsers and current Firefox;
  // where it's unsupported, this just falls back silently to the old
  // multi-page behavior — no worse than before.)
  //
  // The page-size numbers are a conservative PORTRAIT estimate (A4/
  // Letter minus the @page margin, at 96 CSS px/inch, with extra slack)
  // rather than trying to force landscape — browsers vary widely in how
  // (and whether) they honor a requested page orientation, so assuming
  // the narrower, more common default and understating the available
  // space is what actually guarantees nothing gets cut off, even if it
  // means printing a bit smaller than strictly necessary.
  const PRINT_PAGE_W = 680, PRINT_PAGE_H = 900;

  function printTree() {
    const treeInner = document.getElementById("treeInner");
    const spacer = document.getElementById("treeZoomSpacer");
    if (lastLayoutWidth && lastLayoutHeight) {
      const printScale = Math.min(PRINT_PAGE_W / lastLayoutWidth, PRINT_PAGE_H / lastLayoutHeight, 1);
      treeInner.style.transform = "none";
      treeInner.style.zoom = printScale;
      // #treeInner is position:absolute (so on-screen zooming never
      // disturbs #treeWrap's scroll math) — which also means NEITHER
      // zoom NOR transform on it ever changes #treeZoomSpacer's own
      // size, because an absolutely-positioned box is out of normal flow
      // and never contributes to a parent's size. #treeZoomSpacer's size
      // has to be set explicitly to the scaled footprint here, or it
      // keeps reserving the old, larger on-screen size and the page
      // still paginates as if nothing shrank.
      spacer.style.width = (lastLayoutWidth * printScale) + "px";
      spacer.style.height = (lastLayoutHeight * printScale) + "px";
    }
    window.print();
  }

  window.addEventListener("afterprint", () => {
    document.getElementById("treeInner").style.zoom = "";
    applyZoom(); // restores the transform-based on-screen zoom
  });

  // --- Export as image (PNG) ----------------------------------------------
  // Draws the whole tree onto an off-screen <canvas> and downloads it as a
  // PNG — independent of DOM/SVG rendering (which foreignObject-to-canvas
  // export handles unreliably across browsers, especially Safari/iOS,
  // where such a canvas is often left "tainted" and toDataURL()/toBlob()
  // throws). Re-runs layout() to get fresh positions rather than reading
  // the live DOM, since the DOM may currently be scaled by on-screen zoom.
  async function exportImage() {
    if (people.length === 0) return;

    const { positions, width, height } = layout();
    const PAD = 24, SCALE = 2; // 2x for a crisp PNG on high-DPI screens
    const w = Math.ceil(width + PAD * 2), h = Math.ceil(height + PAD * 2);

    const canvas = document.createElement("canvas");
    canvas.width = w * SCALE;
    canvas.height = h * SCALE;
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);

    const css = getComputedStyle(document.documentElement);
    const colors = {
      bg: css.getPropertyValue("--bg").trim(),
      card: css.getPropertyValue("--card").trim(),
      cardBorder: css.getPropertyValue("--card-border").trim(),
      ink: css.getPropertyValue("--ink").trim(),
      inkDim: css.getPropertyValue("--ink-dim").trim(),
      accent: css.getPropertyValue("--accent").trim(),
    };

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, w, h);
    ctx.translate(PAD, PAD);

    const images = new Map();
    await Promise.all(people.filter(p => p.photo).map(p => new Promise((resolve) => {
      const img = new Image();
      img.onload = () => { images.set(p.id, img); resolve(); };
      img.onerror = () => resolve();
      img.src = p.photo;
    })));

    function strokeLine(x1, y1, x2, y2, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // Connector lines — mirrors the SVG-drawing logic in render().
    const drawnSpousePairs = new Set();
    for (const p of people) {
      if (p.spouse && byId(p.spouse)) {
        const key = [p.id, p.spouse].sort().join("|");
        if (drawnSpousePairs.has(key)) continue;
        drawnSpousePairs.add(key);
        const a = positions[p.id], b = positions[p.spouse];
        const spouseColor = theme === "light" ? "rgba(179,114,28,0.55)" : "rgba(232,176,75,0.5)";
        strokeLine(a.x, a.y + CARD_H / 2, b.x, b.y + CARD_H / 2, spouseColor);
      }
    }
    for (const p of people) {
      if (p.parents.length === 0) continue;
      const validParents = p.parents.filter(id => positions[id]);
      if (validParents.length === 0) continue;
      const parentXs = validParents.map(id => positions[id].x);
      const parentBottoms = validParents.map(id => positions[id].y + CARD_H);
      const busY = Math.max(...parentBottoms) + 14;
      const originX = parentXs.reduce((a, b) => a + b, 0) / parentXs.length;
      const familyColor = familyLineColor(validParents);
      parentXs.forEach((x, i) => strokeLine(x, parentBottoms[i], x, busY, familyColor));
      const minX = Math.min(...parentXs), maxX = Math.max(...parentXs);
      if (minX !== maxX) strokeLine(minX, busY, maxX, busY, familyColor);
      const childPos = positions[p.id];
      const midY = originX === childPos.x ? busY : (busY + childPos.y) / 2;
      strokeLine(originX, busY, originX, midY, familyColor);
      strokeLine(originX, midY, childPos.x, midY, familyColor);
      strokeLine(childPos.x, midY, childPos.x, childPos.y, familyColor);
    }

    // Cards.
    function roundRect(x, y, rw, rh, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + rw, y, x + rw, y + rh, r);
      ctx.arcTo(x + rw, y + rh, x, y + rh, r);
      ctx.arcTo(x, y + rh, x, y, r);
      ctx.arcTo(x, y, x + rw, y, r);
      ctx.closePath();
    }
    for (const p of people) {
      const pos = positions[p.id];
      const x = pos.x - CARD_W / 2, y = pos.y;
      roundRect(x, y, CARD_W, CARD_H, 10);
      ctx.fillStyle = colors.card;
      ctx.fill();
      ctx.strokeStyle = colors.cardBorder;
      ctx.lineWidth = 1;
      ctx.stroke();

      const padX = 10, photoSize = 34, cy = y + 10;
      const img = images.get(p.id);
      if (img) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x + padX + photoSize / 2, cy + photoSize / 2, photoSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, x + padX, cy, photoSize, photoSize);
        ctx.restore();
      } else {
        ctx.fillStyle = colors.accent;
        ctx.beginPath();
        ctx.arc(x + padX + photoSize / 2, cy + photoSize / 2, photoSize / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors.card;
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText((p.name.trim().charAt(0) || "?").toUpperCase(), x + padX + photoSize / 2, cy + photoSize / 2 + 1);
      }

      const textX = x + padX + photoSize + 8;
      ctx.save();
      ctx.beginPath();
      ctx.rect(textX, y, CARD_W - (textX - x) - padX, CARD_H - 10);
      ctx.clip();
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = colors.ink;
      ctx.font = "bold 13px sans-serif";
      ctx.fillText(p.name, textX, cy + 12);

      ctx.font = "11px sans-serif";
      ctx.fillStyle = colors.inkDim;
      const bornText = formatDate(p.birth) || "—";
      const deathText = formatDate(p.death);
      ctx.fillText(deathText ? `${bornText} – ${deathText}` : bornText, textX, cy + 27);

      const age = calculateAge(p.birth, p.death);
      if (age !== null) ctx.fillText(t(p.death ? "agedX" : "ageX", { age }), textX, cy + 41);
      ctx.restore();
    }

    canvas.toBlob((blob) => {
      if (!blob) return;
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `family-tree-${stamp}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, "image/png");
  }

  // Fires in every OTHER tab/window on this origin when localStorage
  // changes here — never in the tab that made the change itself. Without
  // this, an older tab left open (e.g. the installed app in one window
  // and a plain browser tab in another) keeps showing whatever it loaded
  // at open time; if the person later triggers ANY save in that stale
  // tab (an edit, a delete, even just adding someone), it silently
  // overwrites localStorage with its outdated in-memory copy — undoing
  // a newer save (e.g. importing a corrected file) made in the other
  // tab, with no error or warning. Reloading from storage here instead
  // keeps every open tab in sync with whichever one saved last.
  window.addEventListener("storage", (e) => {
    if (e.key !== STORAGE_KEY) return;
    people = load();
    if (editingId) cancelEdit();
    hidePersonInfo();
    render();
  });
  document.getElementById("exportBtn").addEventListener("click", exportToFile);
  document.getElementById("exportImageBtn").addEventListener("click", exportImage);
  document.getElementById("shareBtn").addEventListener("click", shareFile);
  shareIsSupported().then((supported) => { document.getElementById("shareBtn").hidden = !supported; });

  const importFileInput = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", async () => {
    // Prefer the File System Access API so a successful load also hands
    // back a read-write handle — that's what lets "Save to file"
    // afterward go straight back into THIS file instead of prompting for
    // a new one every time (see currentFileHandle / exportToFile).
    if (window.showOpenFilePicker) {
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        const file = await handle.getFile();
        if (await importFromFile(file)) {
          currentFileHandle = handle;
          persistFileHandle(handle);
        }
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; // user cancelled the picker
        // any other error (e.g. unsupported in this context) — fall through to the classic picker below
      }
    }
    importFileInput.click();
  });
  importFileInput.addEventListener("change", () => {
    if (importFileInput.files[0]) importFromFile(importFileInput.files[0]);
    importFileInput.value = ""; // so picking the same file again still fires "change"
  });

  document.getElementById("langToggle").addEventListener("click", () => {
    lang = lang === "en" ? "bg" : "en";
    try { localStorage.setItem(LANG_KEY, lang); } catch { /* ignore */ }
    applyStaticTranslations();
    render();
  });

  document.getElementById("themeToggle").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, theme); } catch { /* ignore */ }
    applyTheme();
    render(); // family-line colors bake theme-dependent lightness at render time, unlike var(--line)
  });

  for (const selectId of ["fParent1", "fParent2", "fSpouse"]) {
    setupTypeAhead(document.getElementById(selectId));
  }

  applyTheme();
  applyStaticTranslations();
  render();
})();
</script>
<div id="updateBanner" class="update-banner" hidden>
  <span data-i18n="updateAvailable">A new version is available.</span>
  <button type="button" id="updateReloadBtn" data-i18n="updateReload">Reload</button>
</div>
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("family-tree-sw.js").then((registration) => {
        // A worker already sitting in "waiting" (e.g. this tab was opened
        // before the new one finished installing) means an update is ready now.
        if (registration.waiting) showUpdateBanner(registration);

        registration.addEventListener("updatefound", () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            // "installed" + an existing controller means this is an UPDATE,
            // not the very first install — the first install has no
            // controller yet, and shouldn't show an "update available" banner.
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
              showUpdateBanner(registration);
            }
          });
        });
      }).catch(() => {});

      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }

  function showUpdateBanner(registration) {
    const banner = document.getElementById("updateBanner");
    banner.hidden = false;
    document.getElementById("updateReloadBtn").addEventListener("click", () => {
      if (registration.waiting) registration.waiting.postMessage("SKIP_WAITING");
    }, { once: true });
  }
</script>
</body>
</html>
