<!doctype html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Family Tree</title>
<link rel="manifest" href="family-tree.manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Tree">
<style>
  :root {
    --bg: #14171a;
    --bg-deep: #0b0d0f;
    --card: #1c2023;
    --card-border: #2b3136;
    --card-hover: rgba(255, 255, 255, 0.08);
    --accent: #e8b04b;
    --accent-dim: rgba(232, 176, 75, 0.35);
    --ink: #eceef0;
    --ink-dim: #9aa3aa;
    --line: #4a5058;
    --danger: #e5686b;
    --btn-primary-bg: #e8b04b;
    --btn-primary-text: #201a08;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  :root[data-theme="light"] {
    --bg: #f1ece1;
    --bg-deep: #e3dbca;
    --card: #ffffff;
    --card-border: #ded4c0;
    --card-hover: rgba(0, 0, 0, 0.04);
    --accent: #b3721c;
    --accent-dim: rgba(179, 114, 28, 0.2);
    --ink: #292319;
    --ink-dim: #756c5c;
    --line: #b7ac97;
    --danger: #c8443f;
    --btn-primary-bg: #3a3f46;
    --btn-primary-text: #f5f5f6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--bg) 0%, var(--bg-deep) 70%);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem 4rem;
  }

  header {
    text-align: center;
    max-width: 34rem;
    margin-bottom: 2rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.7rem;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    margin: 0 0 0.6rem;
  }

  .logo {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.55rem;
    flex-shrink: 0;
    object-fit: cover;
  }

  h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.3rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
  }

  main {
    width: 100%;
    max-width: 96rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
  }

  .panel h2 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 1rem;
  }

  form#addForm {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.8rem;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: 0;
  }

  .field.wide {
    grid-column: span 2;
  }

  .field label {
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  .field input, .field select {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    border-radius: 7px;
    color: var(--ink);
    padding: 0.5rem 0.6rem;
    font-size: 0.88rem;
    font-family: var(--sans);
  }

  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }

  #fBirthInput, #fDeathInput { cursor: pointer; }

  .file-input {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .file-input-btn {
    flex: none;
    font-size: 0.8rem;
    padding: 0.5rem 0.6rem;
  }

  .photo-preview-wrap {
    margin-top: 0.5rem;
  }

  .photo-preview-frame {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
  }

  .photo-preview-frame img {
    display: block;
    max-width: 220px;
    max-height: 220px;
    width: auto;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    cursor: crosshair;
  }

  .photo-focus-marker {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.6);
    pointer-events: none;
  }

  .photo-preview-hint {
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin: 0.3rem 0 0;
  }

  .photo-remove-btn {
    margin-top: 0.4rem;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--danger);
    font-size: 0.72rem;
    padding: 0.35rem 0.6rem;
  }
  .photo-remove-btn:hover { border-color: var(--danger); filter: none; }

  /* A small custom calendar popup — a real day-grid to click, not native
     browser date-input chrome (whose format/locale we can't control) and
     not bare Day/Month/Year selects either. Always Day-Month-Year in its
     own header, so the month reads in the middle no matter the browser. */
  .date-popup {
    position: absolute;
    z-index: 20;
    width: 260px;
    max-width: calc(100vw - 16px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem;
    box-shadow: 0 12px 28px -8px rgba(0,0,0,0.6);
  }

  .dp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
  }

  .dp-nav {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
  }

  .dp-title {
    display: flex;
    gap: 0.3rem;
    flex: 1;
  }
  .dp-title select, .dp-title input {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    color: var(--ink);
    font-size: 0.8rem;
    padding: 0.3rem 0.35rem;
  }
  .dp-title select { flex: 1.3; }
  .dp-title input { flex: 1; min-width: 0; }

  .dp-weekdays, .dp-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .dp-weekdays span {
    text-align: center;
    font-size: 0.66rem;
    color: var(--ink-dim);
    padding: 0.2rem 0;
  }

  .dp-grid button {
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 0.78rem;
    padding: 0.35rem 0;
    border-radius: 6px;
  }
  .dp-grid button:hover { background: var(--card-hover, rgba(255,255,255,0.08)); }
  .dp-grid button.dp-outside { color: var(--ink-dim); opacity: 0.4; }
  .dp-grid button.dp-selected { background: var(--accent); color: #201a08; font-weight: 700; }
  .dp-grid button.dp-today:not(.dp-selected) { border: 1px solid var(--accent-dim); }

  .dp-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--card-border);
  }
  .dp-footer button {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-size: 0.72rem;
    padding: 0.2rem 0.3rem;
    text-decoration: underline;
  }
  .dp-footer button:hover { color: var(--accent); }

  .person-info-popup {
    position: absolute;
    z-index: 25;
    width: 220px;
    max-width: calc(100vw - 16px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
  }

  .person-info-popup .info-name {
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 0.4rem;
    word-break: break-word;
  }

  .person-info-popup .info-row {
    display: flex;
    gap: 0.4rem;
    font-size: 0.76rem;
    color: var(--ink);
    padding: 0.15rem 0;
  }
  .person-info-popup .info-row[hidden] { display: none; }

  .person-info-popup .info-label {
    flex: none;
    color: var(--ink-dim);
    min-width: 4.2rem;
  }

  .person-info-popup .info-edit-btn {
    margin-top: 0.55rem;
    width: 100%;
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    font-size: 0.78rem;
    padding: 0.4rem 0.6rem;
  }

  button {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.85rem;
    border: none;
    border-radius: 7px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }

  #addForm button {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    grid-column: span 1;
    align-self: end;
  }

  #addForm #cancelEditBtn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    align-self: end;
  }
  #addForm #cancelEditBtn:hover { border-color: var(--danger); color: var(--danger); }

  .person.editing {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  .person .edit-hint {
    font-size: 0.6rem;
    color: var(--ink-dim);
    opacity: 0;
    margin-top: 0.15rem;
    transition: opacity 0.1s ease;
  }
  .person:hover .edit-hint { opacity: 0.85; }

  #treeWrap {
    overflow: auto;
    border-radius: 10px;
    background: var(--bg-deep);
    min-height: 340px;
    max-height: 82vh;
    position: relative;
    /* display:flex here is only so #treeZoomSpacer's margin:auto (below)
       can center it when it's smaller than the viewport (e.g. zoomed far
       out) — scrolling can't shift content past x/y=0, so without this
       it sticks to the top-left instead of looking centered. Deliberately
       NOT using align-items/justify-content:center for this — centering
       an OVERFLOWING flex item that way is a well-known trap: browsers
       split the overflow evenly on both sides, which moves the start of
       the scrollable area past the content's actual top-left corner and
       makes it impossible to scroll back to it. margin:auto on the child
       doesn't have that problem — it only centers when there's genuine
       extra space, and falls back to 0 (normal scrolling) once the
       content is larger than the container. */
    display: flex;
  }

  #treeZoomSpacer {
    position: relative;
    margin: auto; /* see #treeWrap's display:flex comment */
    flex-shrink: 0; /* never let the flex layout shrink it below its set size */
  }

  #treeInner {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
  }

  .zoom-controls {
    display: flex;
    gap: 0.3rem;
  }
  .zoom-controls button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 0.95rem;
    line-height: 1;
  }
  .zoom-controls button:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  .person {
    position: absolute;
    width: 140px;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 9px;
    padding: 0.5rem 0.6rem;
    text-align: center;
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  .person .photo, .person .photo-placeholder {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin: 0 auto 0.35rem;
    border: 1.5px solid var(--card-border);
    background: var(--bg-deep);
    display: block;
  }

  .person .photo { object-fit: cover; }

  .person .photo-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-dim);
  }

  .person .name {
    font-weight: 700;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person .origin {
    font-size: 0.62rem;
    font-style: italic;
    color: var(--ink-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person .dates {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--ink-dim);
    margin-top: 0.15rem;
  }

  .person .age {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--accent);
    margin-top: 0.1rem;
  }

  .person .children-count {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--ink-dim);
    margin-top: 0.2rem;
    padding-top: 0.2rem;
    border-top: 1px solid var(--card-border);
  }

  .person .del {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--danger);
    color: #2a0d0e;
    font-size: 0.65rem;
    font-weight: 800;
    line-height: 18px;
    text-align: center;
    padding: 0;
    display: none;
  }
  .person:hover .del { display: block; }

  .empty-hint {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.9rem;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
  }
  .toolbar-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-self: start;
  }
  .zoom-controls { justify-self: center; }
  #clearAllBtn { justify-self: end; }

  .toolbar button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
  }
  .toolbar-group button:hover { border-color: var(--accent); color: var(--accent); }
  #clearAllBtn:hover { border-color: var(--danger); color: var(--danger); }

  footer {
    margin: 1rem auto 0;
    font-size: 0.8rem;
    color: var(--ink-dim);
    text-align: center;
    max-width: 30rem;
    line-height: 1.5;
  }

  .update-banner {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 0.6rem 0.6rem 0.6rem 1.1rem;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    font-size: 0.85rem;
    color: var(--ink);
    max-width: calc(100vw - 2rem);
  }
  .update-banner[hidden] { display: none; }
  .update-banner button {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    border: none;
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* Print: just the tree, on paper-friendly light colors, with the full
     tree visible (not clipped to whatever fit the on-screen scroll box). */
  @page { margin: 10mm; }

  @media print {
    header .eyebrow, .surprise-btn, form#addForm,
    .panel h2, .toolbar, footer, .edit-hint, .del, .header-controls, .zoom-controls, .update-banner {
      display: none !important;
    }
    /* #treeInner's own zoom is set in JS right before printing, sized to
       fit the printed page — see printTree(). It must NOT be forced back
       to unscaled here, or a tree wider than one page just gets cut off
       at the page edge instead of shrunk to fit. */
    html, body { background: #fff; }
    .panel {
      background: #fff;
      border: none;
      padding: 0;
    }
    #treeWrap {
      overflow: visible;
      background: #fff;
      min-height: 0;
      max-height: none;
    }
    .person {
      border-color: #999;
      box-shadow: none;
      background: #fafafa;
    }
    .person .name { color: #111; }
    .person .origin { color: #555; }
    .person .dates, .person .age { color: #444; }
    .person .children-count { color: #444; border-top-color: #ccc; }
    line { stroke: #888 !important; }
  }

  /* Mobile tightening — form fields stack to one/two columns, panels lose
     side padding, the language toggle stays reachable in the header. */
  @media (max-width: 640px) {
    body { padding: 1.5rem 0.85rem 3rem; }
    header { margin-bottom: 1.4rem; }
    .panel { padding: 1rem 0.9rem; }
    form#addForm { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .toolbar { grid-template-columns: 1fr; justify-items: center; }
    .toolbar-group { justify-content: center; justify-self: center; }
    .zoom-controls { justify-self: center; }
    #clearAllBtn { width: 100%; justify-self: center; }
  }

  .header-controls {
    /* Absolute (not fixed) so it stays put at the top of the page and
       scrolls away with the header instead of floating over the tree —
       positioned against the page's own top-right corner (no positioned
       ancestor in between) rather than the header's own box, which is
       narrower than the rest of the page and would pull it in from the
       true edge. */
    position: absolute;
    top: 1.4rem;
    right: 1.8rem;
    z-index: 30;
    display: flex;
    gap: 0.5rem;
  }

  .lang-toggle, .theme-toggle {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 0.35rem 0.65rem;
  }
  .lang-toggle:hover, .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

</style>
</head>
<body>

<header>
  <div class="header-controls">
    <button class="theme-toggle" id="themeToggle" type="button">&#9789;</button>
    <button class="lang-toggle" id="langToggle" type="button">BG</button>
  </div>
  <p class="eyebrow" data-i18n="eyebrow">Genealogy</p>
  <div class="title-row">
    <img class="logo" src="icon-192.png" alt="">
    <h1 data-i18n="title">Family Tree</h1>
  </div>
</header>

<main>
  <section class="panel">
    <h2 data-i18n="addPersonHeading">Add a person</h2>
    <form id="addForm">
      <div class="field">
        <label for="fName" data-i18n="labelName">Name</label>
        <input id="fName" type="text" data-i18n-placeholder="placeholderName" placeholder="Full name" required>
      </div>
      <div class="field">
        <label for="fOrigin" data-i18n="labelOrigin">Family of origin</label>
        <input id="fOrigin" type="text" data-i18n-placeholder="placeholderOptional" placeholder="optional">
      </div>
      <div class="field">
        <label for="fPhoto" data-i18n="labelPhoto">Photo</label>
        <div class="file-input">
          <button type="button" id="fPhotoBtn" class="file-input-btn" data-i18n="choosePhoto">Choose File</button>
        </div>
        <input id="fPhoto" type="file" accept="image/*" hidden>
        <div id="photoPreviewWrap" class="photo-preview-wrap" hidden>
          <div class="photo-preview-frame">
            <img id="photoPreviewImg" alt="">
            <div id="photoFocusMarker" class="photo-focus-marker"></div>
          </div>
          <p class="photo-preview-hint" data-i18n="photoPreviewHint">Click the photo to center it on the face.</p>
          <button type="button" id="photoRemoveBtn" class="photo-remove-btn" data-i18n="removePhoto">Remove photo</button>
        </div>
      </div>
      <div class="field">
        <label for="fBirthInput" data-i18n="labelBorn">Born</label>
        <input id="fBirthInput" type="text" readonly autocomplete="off" data-i18n-placeholder="placeholderPickDate" placeholder="Click">
        <input type="hidden" id="fBirthValue">
      </div>
      <div class="field">
        <label for="fDeathInput" data-i18n="labelDied">Died</label>
        <input id="fDeathInput" type="text" readonly autocomplete="off" data-i18n-placeholder="placeholderOptional" placeholder="optional">
        <input type="hidden" id="fDeathValue">
      </div>
      <div class="field">
        <label for="fSpouse" data-i18n="labelSpouse">Spouse</label>
        <select id="fSpouse"><option value="" data-i18n="none">— none —</option></select>
      </div>
      <div class="field">
        <label for="fParent1" data-i18n="labelParent">Parent</label>
        <select id="fParent1"><option value="" data-i18n="none">— none —</option></select>
      </div>
      <div class="field">
        <label for="fParent2" data-i18n="labelParent2">Parent 2</label>
        <select id="fParent2"><option value="" data-i18n="none">— none —</option></select>
      </div>
      <button type="submit" id="submitBtn" data-i18n="addPerson">Add person</button>
      <button type="button" id="cancelEditBtn" data-i18n="cancelEdit" hidden>Cancel edit</button>
    </form>
  </section>

  <div id="datePopup" class="date-popup" hidden>
    <div class="dp-header">
      <button type="button" id="dpPrev" class="dp-nav" data-i18n-aria-label="prevMonth" aria-label="Previous month">‹</button>

      print: "Печат",
