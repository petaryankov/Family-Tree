<!doctype html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Family Tree</title>
<link rel="manifest" href="family-tree.manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Tree">
<style>
  :root {
    --bg: #14171a;
    --bg-deep: #0b0d0f;
    --card: #1c2023;
    --card-border: #2b3136;
    --card-hover: rgba(255, 255, 255, 0.08);
    --accent: #e8b04b;
    --accent-dim: rgba(232, 176, 75, 0.35);
    --ink: #eceef0;
    --ink-dim: #9aa3aa;
    --line: #4a5058;
    --danger: #e5686b;
    --btn-primary-bg: #e8b04b;
    --btn-primary-text: #201a08;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  :root[data-theme="light"] {
    --bg: #f1ece1;
    --bg-deep: #e3dbca;
    --card: #ffffff;
    --card-border: #ded4c0;
    --card-hover: rgba(0, 0, 0, 0.04);
    --accent: #b3721c;
    --accent-dim: rgba(179, 114, 28, 0.2);
    --ink: #292319;
    --ink-dim: #756c5c;
    --line: #b7ac97;
    --danger: #c8443f;
    --btn-primary-bg: #3a3f46;
    --btn-primary-text: #f5f5f6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at 50% -10%, var(--bg) 0%, var(--bg-deep) 70%);
    color: var(--ink);
    font-family: var(--sans);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem 4rem;
  }

  header {
    text-align: center;
    max-width: 34rem;
    margin-bottom: 2rem;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.7rem;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    margin: 0 0 0.6rem;
  }

  .logo {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.55rem;
    flex-shrink: 0;
    object-fit: cover;
  }

  h1 {
    font-size: clamp(1.7rem, 4.5vw, 2.3rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
  }

  main {
    width: 100%;
    max-width: 96rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.25rem 1.4rem;
  }

  .panel h2 {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 1rem;
  }

  form#addForm {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.8rem;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: 0;
  }

  .field.wide {
    grid-column: span 2;
  }

  .field label {
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  .field input, .field select {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    border-radius: 7px;
    color: var(--ink);
    padding: 0.5rem 0.6rem;
    font-size: 0.88rem;
    font-family: var(--sans);
  }

  .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
  }

  #fBirthInput, #fDeathInput { cursor: pointer; }

  .file-input {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .file-input-btn {
    flex: none;
    font-size: 0.8rem;
    padding: 0.5rem 0.6rem;
  }

  .photo-preview-wrap {
    margin-top: 0.5rem;
  }

  .photo-preview-frame {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
  }

  .photo-preview-frame img {
    display: block;
    max-width: 220px;
    max-height: 220px;
    width: auto;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    cursor: crosshair;
  }

  .photo-focus-marker {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.6);
    pointer-events: none;
  }

  .photo-preview-hint {
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin: 0.3rem 0 0;
  }

  .photo-remove-btn {
    margin-top: 0.4rem;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--danger);
    font-size: 0.72rem;
    padding: 0.35rem 0.6rem;
  }
  .photo-remove-btn:hover { border-color: var(--danger); filter: none; }

  /* A small custom calendar popup — a real day-grid to click, not native
     browser date-input chrome (whose format/locale we can't control) and
     not bare Day/Month/Year selects either. Always Day-Month-Year in its
     own header, so the month reads in the middle no matter the browser. */
  .date-popup {
    position: absolute;
    z-index: 20;
    width: 260px;
    max-width: calc(100vw - 16px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem;
    box-shadow: 0 12px 28px -8px rgba(0,0,0,0.6);
  }

  .dp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    margin-bottom: 0.5rem;
  }

  .dp-nav {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    color: var(--ink);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
  }

  .dp-title {
    display: flex;
    gap: 0.3rem;
    flex: 1;
  }
  .dp-title select, .dp-title input {
    background: var(--bg-deep);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    color: var(--ink);
    font-size: 0.8rem;
    padding: 0.3rem 0.35rem;
  }
  .dp-title select { flex: 1.3; }
  .dp-title input { flex: 1; min-width: 0; }

  .dp-weekdays, .dp-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .dp-weekdays span {
    text-align: center;
    font-size: 0.66rem;
    color: var(--ink-dim);
    padding: 0.2rem 0;
  }

  .dp-grid button {
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 0.78rem;
    padding: 0.35rem 0;
    border-radius: 6px;
  }
  .dp-grid button:hover { background: var(--card-hover, rgba(255,255,255,0.08)); }
  .dp-grid button.dp-outside { color: var(--ink-dim); opacity: 0.4; }
  .dp-grid button.dp-selected { background: var(--accent); color: #201a08; font-weight: 700; }
  .dp-grid button.dp-today:not(.dp-selected) { border: 1px solid var(--accent-dim); }

  .dp-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--card-border);
  }
  .dp-footer button {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-size: 0.72rem;
    padding: 0.2rem 0.3rem;
    text-decoration: underline;
  }
  .dp-footer button:hover { color: var(--accent); }

  .person-info-popup {
    position: absolute;
    z-index: 25;
    width: 220px;
    max-width: calc(100vw - 16px);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
  }

  .person-info-popup .info-name {
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 0.4rem;
    word-break: break-word;
  }

  .person-info-popup .info-row {
    display: flex;
    gap: 0.4rem;
    font-size: 0.76rem;
    color: var(--ink);
    padding: 0.15rem 0;
  }
  .person-info-popup .info-row[hidden] { display: none; }

  .person-info-popup .info-label {
    flex: none;
    color: var(--ink-dim);
    min-width: 4.2rem;
  }

  .person-info-popup .info-edit-btn {
    margin-top: 0.55rem;
    width: 100%;
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    font-size: 0.78rem;
    padding: 0.4rem 0.6rem;
  }

  button {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.85rem;
    border: none;
    border-radius: 7px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }

  #addForm button {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    grid-column: span 1;
    align-self: end;
  }

  #addForm #cancelEditBtn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    align-self: end;
  }
  #addForm #cancelEditBtn:hover { border-color: var(--danger); color: var(--danger); }

  .person.editing {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  .person .edit-hint {
    font-size: 0.6rem;
    color: var(--ink-dim);
    opacity: 0;
    margin-top: 0.15rem;
    transition: opacity 0.1s ease;
  }
  .person:hover .edit-hint { opacity: 0.85; }

  #treeWrap {
    overflow: auto;
    border-radius: 10px;
    background: var(--bg-deep);
    min-height: 340px;
    max-height: 82vh;
    position: relative;
    /* display:flex here is only so #treeZoomSpacer's margin:auto (below)
       can center it when it's smaller than the viewport (e.g. zoomed far
       out) — scrolling can't shift content past x/y=0, so without this
       it sticks to the top-left instead of looking centered. Deliberately
       NOT using align-items/justify-content:center for this — centering
       an OVERFLOWING flex item that way is a well-known trap: browsers
       split the overflow evenly on both sides, which moves the start of
       the scrollable area past the content's actual top-left corner and
       makes it impossible to scroll back to it. margin:auto on the child
       doesn't have that problem — it only centers when there's genuine
       extra space, and falls back to 0 (normal scrolling) once the
       content is larger than the container. */
    display: flex;
  }

  #treeZoomSpacer {
    position: relative;
    margin: auto; /* see #treeWrap's display:flex comment */
    flex-shrink: 0; /* never let the flex layout shrink it below its set size */
  }

  #treeInner {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
  }

  .zoom-controls {
    display: flex;
    gap: 0.3rem;
  }
  .zoom-controls button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 0.95rem;
    line-height: 1;
  }
  .zoom-controls button:hover { border-color: var(--accent); color: var(--accent); filter: none; }

  .person {
    position: absolute;
    width: 140px;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 9px;
    padding: 0.5rem 0.6rem;
    text-align: center;
    box-shadow: 0 4px 10px -4px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  .person .photo, .person .photo-placeholder {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin: 0 auto 0.35rem;
    border: 1.5px solid var(--card-border);
    background: var(--bg-deep);
    display: block;
  }

  .person .photo { object-fit: cover; cursor: pointer; }

  .person .photo-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-dim);
  }

  .person .name {
    font-weight: 700;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person .origin {
    font-size: 0.62rem;
    font-style: italic;
    color: var(--ink-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .person .dates {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--ink-dim);
    margin-top: 0.15rem;
  }

  .person .age {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--accent);
    margin-top: 0.1rem;
  }

  .person .children-count {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--ink-dim);
    margin-top: 0.2rem;
    padding-top: 0.2rem;
    border-top: 1px solid var(--card-border);
  }

  .person .del {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--danger);
    color: #2a0d0e;
    font-size: 0.65rem;
    font-weight: 800;
    line-height: 18px;
    text-align: center;
    padding: 0;
    display: none;
  }
  .person:hover .del { display: block; }

  .empty-hint {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.9rem;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.8rem;
  }
  .toolbar-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-self: start;
  }
  .zoom-controls { justify-self: center; }
  #clearAllBtn { justify-self: end; }

  .toolbar button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
  }
  .toolbar-group button:hover { border-color: var(--accent); color: var(--accent); }
  #clearAllBtn:hover { border-color: var(--danger); color: var(--danger); }

  .tree-search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }
  .tree-search input {
    flex: 1;
    max-width: 20rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--ink);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
  }
  .tree-search input:focus { outline: none; border-color: var(--accent); }
  .search-count {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .search-clear {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    border-radius: 999px;
    width: 1.7rem;
    height: 1.7rem;
    line-height: 1;
    font-size: 1rem;
  }
  .search-clear:hover { border-color: var(--danger); color: var(--danger); }

  .person.search-match { border-color: var(--accent); }
  .person.search-current, .person.rel-path {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .relationship-finder {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
  }
  .relationship-finder select {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--ink);
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
    max-width: 11rem;
  }
  .relationship-finder select:focus { outline: none; border-color: var(--accent); }
  .relationship-finder button {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
  }
  .relationship-finder button:hover { border-color: var(--accent); color: var(--accent); }
  .rel-result {
    font-size: 0.85rem;
    color: var(--ink-dim);
  }
  .rel-result.no-path { color: var(--danger); }

  .tree-stats {
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin-bottom: 0.6rem;
  }

  .photo-lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .photo-lightbox[hidden] { display: none; }
  .photo-lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 10px;
    box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.8);
  }
  .photo-lightbox-close {
    position: fixed;
    top: 1.2rem;
    right: 1.4rem;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    width: 2.2rem;
    height: 2.2rem;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0;
  }
  .photo-lightbox-close:hover { background: rgba(255, 255, 255, 0.2); filter: none; }

  footer {
    margin: 1rem auto 0;
    font-size: 0.8rem;
    color: var(--ink-dim);
    text-align: center;
    max-width: 30rem;
    line-height: 1.5;
  }

  .update-banner {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 0.6rem 0.6rem 0.6rem 1.1rem;
    box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    font-size: 0.85rem;
    color: var(--ink);
    max-width: calc(100vw - 2rem);
  }
  .update-banner[hidden] { display: none; }
  .update-banner button {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
    border: none;
    border-radius: 999px;
    padding: 0.4rem 0.9rem;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  /* Print: just the tree, on paper-friendly light colors, with the full
     tree visible (not clipped to whatever fit the on-screen scroll box). */
  @page { margin: 10mm; }

  @media print {
    header .eyebrow, .surprise-btn, form#addForm,
    .panel h2, .toolbar, footer, .edit-hint, .del, .header-controls, .zoom-controls, .update-banner, .tree-search, .relationship-finder, .tree-stats {
      display: none !important;
    }
    /* #treeInner's own zoom is set in JS right before printing, sized to
       fit the printed page — see printTree(). It must NOT be forced back
       to unscaled here, or a tree wider than one page just gets cut off
       at the page edge instead of shrunk to fit. */
    html, body { background: #fff; }
    .panel {
      background: #fff;
      border: none;
      padding: 0;
    }
    #treeWrap {
      overflow: visible;
      background: #fff;
      min-height: 0;
      max-height: none;
    }
    .person {
      border-color: #999;
      box-shadow: none;
      background: #fafafa;
    }
    .person .name { color: #111; }
    .person .origin { color: #555; }
    .person .dates, .person .age { color: #444; }
    .person .children-count { color: #444; border-top-color: #ccc; }
    line { stroke: #888 !important; }
  }

  /* Mobile tightening — form fields stack to one/two columns, panels lose
     side padding, the language toggle stays reachable in the header. */
  @media (max-width: 640px) {
    body { padding: 1.5rem 0.85rem 3rem; }
    header { margin-bottom: 1.4rem; }
    .panel { padding: 1rem 0.9rem; }
    form#addForm { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .toolbar { grid-template-columns: 1fr; justify-items: center; }
    .toolbar-group { justify-content: center; justify-self: center; }
    .zoom-controls { justify-self: center; }
    #clearAllBtn { width: 100%; justify-self: center; }
  }

  .header-controls {
    /* Absolute (not fixed) so it stays put at the top of the page and
       scrolls away with the header instead of floating over the tree —
       positioned against the page's own top-right corner (no positioned
       ancestor in between) rather than the header's own box, which is
       narrower than the rest of the page and would pull it in from the
       true edge. */
    position: absolute;
    top: 1.4rem;
    right: 1.8rem;
    z-index: 30;
    display: flex;
    gap: 0.5rem;
  }

  .lang-toggle, .theme-toggle {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 0.35rem 0.65rem;
  }
  .lang-toggle:hover, .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

</style>
</head>
<body>

  let lang = (() => {
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "en" || saved === "bg") return saved;
    } catch { /* ignore */ }
    return navigator.language && navigator.language.toLowerCase().startsWith("bg") ? "bg" : "en";
  })();

  const THEME_KEY = "family-tree-theme-v1";
  let theme = (() => {
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
    } catch { /* ignore */ }
    return "dark"; // default when nothing saved yet, regardless of system preference
  })();

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    const btn = document.getElementById("themeToggle");
    btn.textContent = theme === "dark" ? "☀️" : "🌙"; // sun = switch to light, crescent moon = switch to dark

  function t(key, vars) {
    let str = (translations[lang] && translations[lang][key]) ?? translations.en[key] ?? key;
    if (vars) for (const k in vars) str = str.replace(`{${k}}`, vars[k]);
    return str;

    document.documentElement.lang = lang;
    document.getElementById("pageTitle").textContent = t("pageTitle");

  const SPOUSE_GAP = 32, UNIT_GAP = 46, ROW_H = 220;

  /** @type {{id:string,name:string,photo:string|null,birth:string,death:string,parents:string[],spouse:string|null}[]} */
  let people = load();
  let editingId = null; // id of the person currently loaded into the form for editing, or null

  // The on-disk file this session is "connected" to (Chrome/Edge only —
  // the File System Access API's read-write file handle). Set after a
  // successful load or save through the native picker. While set, "Save
  // to file" writes straight back to this SAME file with no picker at
  // all — the point being that opening a file, fixing a couple of
  // records, and saving should feel like editing a document, not like
  // exporting a brand new copy every time.
  let currentFileHandle = null;

  // A handle recovered from IndexedDB (see below) at page load, whose
  // read-write PERMISSION hasn't been re-confirmed yet this session —
  // browsers require an actual user gesture for that (requestPermission),
  // which a page-load callback isn't, so it waits here until the first
  // Save click, which is one.
  let pendingFileHandle = null;

  // FileSystemFileHandle objects are structured-cloneable, so they can be
  // stashed in IndexedDB — unlike localStorage, which only holds strings.
  // This is what lets "Save to file" keep writing to the SAME file across
  // a page reload/reopen instead of forgetting it the moment the tab
  // closes and falling back to the picker again next time.
  const FILE_HANDLE_DB = "family-tree-file-handle";
  const FILE_HANDLE_STORE = "handles";
  const FILE_HANDLE_KEY = "current";

  function openHandleDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("no indexedDB")); return; }
      const req = indexedDB.open(FILE_HANDLE_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(FILE_HANDLE_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function persistFileHandle(handle) {
    try {
      const db = await openHandleDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(FILE_HANDLE_STORE, "readwrite");
        tx.objectStore(FILE_HANDLE_STORE).put(handle, FILE_HANDLE_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {
      // IndexedDB unavailable, or this browser can't clone a file handle
      // — quick-save just won't survive a reload; exportToFile() still
      // works normally within THIS session either way.
    }
  }

  async function clearPersistedFileHandle() {
    try {
      const db = await openHandleDB();
      db.transaction(FILE_HANDLE_STORE, "readwrite").objectStore(FILE_HANDLE_STORE).delete(FILE_HANDLE_KEY);
    } catch { /* nothing to clear */ }
  }

  // On load, recover a handle from a previous session. If the browser
  // already granted read-write permission durably, reconnect right away;
  // otherwise it's held as "pending" until the person actually clicks
  // Save, since re-asking for permission needs that real click.
  (async () => {
    try {
      const db = await openHandleDB();
      const handle = await new Promise((resolve) => {
        const tx = db.transaction(FILE_HANDLE_STORE, "readonly");
        const req = tx.objectStore(FILE_HANDLE_STORE).get(FILE_HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
      if (!handle) return;
      const perm = await handle.queryPermission({ mode: "readwrite" });
      if (perm === "granted") currentFileHandle = handle;
      else pendingFileHandle = handle;
    } catch {
      // no persisted handle, IndexedDB unavailable, or the handle no
      // longer resolves (file moved/deleted) — Save to file just falls
      // back to asking where to save, same as a brand new session.
    }
  })();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
    } catch { /* storage unavailable — tree still works for this session */ }
  }

  function byId(id) {
    return people.find(p => p.id === id);
  }

  function newId() {
    return "p" + Math.random().toString(36).slice(2, 10);
  }

  function addPerson({ name, origin, photo, photoFocus, birth, death, parent1, parent2, spouse }) {
    const parents = [parent1, parent2].filter(Boolean);
    const person = {
      id: newId(), name: name.trim(), origin: (origin || "").trim(), photo: photo || null,
      photoFocus: photo ? (photoFocus || { x: 50, y: 50 }) : null,
      birth: birth.trim(), death: death.trim(), parents, spouse: spouse || null,
    };
    people.push(person);
    linkSpouse(person.id, spouse);
    save();
    render();
  }

  function updatePerson(id, { name, origin, photo, photoFocus, birth, death, parent1, parent2, spouse }) {
    const person = byId(id);
    if (!person) return;

    // Detach from the old spouse first if the pairing is changing.
    if (person.spouse && person.spouse !== spouse) {
      const oldSpouse = byId(person.spouse);
      if (oldSpouse && oldSpouse.spouse === id) oldSpouse.spouse = null;
    }

    person.name = name.trim();
    person.origin = (origin || "").trim();
    // The form's photo state already reflects the full intent by the time
    // we get here — the existing photo (pre-loaded into the preview when
    // editing began), a freshly picked replacement, or null if the person
    // explicitly removed it — so it's safe to just take it as-is.
    person.photo = photo || null;
    person.photoFocus = photo ? (photoFocus || { x: 50, y: 50 }) : null;
    person.birth = birth.trim();
    person.death = death.trim();
    person.parents = [parent1, parent2].filter(Boolean).filter(pid => pid !== id);
    person.spouse = null;
    linkSpouse(id, spouse === id ? "" : spouse);

    save();
    render();
  }

  // Mutual spouse pairing — also breaks the new spouse's previous pairing
  // (if any) so no one ends up "married" to two people at once.
  function linkSpouse(personId, spouseId) {
    if (!spouseId) return;
    const person = byId(personId);
    const spouse = byId(spouseId);
    if (!person || !spouse) return;
    if (spouse.spouse && spouse.spouse !== personId) {
      const other = byId(spouse.spouse);
      if (other && other.spouse === spouseId) other.spouse = null;
    }
    person.spouse = spouseId;
    spouse.spouse = personId;
  }

  // A snapshot of `people` taken right before the last delete/clear, kept
  // around just long enough for an "Undo" click (see showUndoBanner) — a
  // lightweight safety net for the one class of accidental data loss that
  // has no other recovery path short of reloading an older exported file.
  let undoSnapshot = null;
  let undoHideTimer = null;

  function deletePerson(id) {
    const person = byId(id);
    if (!person) return;
    undoSnapshot = JSON.parse(JSON.stringify(people));
    people = people.filter(p => p.id !== id);
    for (const p of people) {
      p.parents = p.parents.filter(pid => pid !== id);
      if (p.spouse === id) p.spouse = null;
    }
    if (editingId === id) cancelEdit();
    if (infoPersonId === id) hidePersonInfo(); // otherwise the popup lingers, showing a now-deleted person
    save();
    render();
    showUndoBanner(t("personDeleted", { name: person.name }));
  }

  function clearAll() {
    if (!confirm(t("confirmClearAll"))) return;
    undoSnapshot = JSON.parse(JSON.stringify(people));
    people = [];
    hidePersonInfo();
    save();
    render();
    showUndoBanner(t("treeCleared"));
  }

  function showUndoBanner(message) {
    clearTimeout(undoHideTimer);
    const banner = document.getElementById("undoBanner");
    document.getElementById("undoBannerText").textContent = message;
    banner.hidden = false;
    // Auto-hides (and drops the snapshot) after a while so "Undo" doesn't
    // linger indefinitely and silently revert a much later, unrelated change.
    undoHideTimer = setTimeout(() => {
      banner.hidden = true;
      undoSnapshot = null;
    }, 8000);
  }

  // --- Save to / load from file ------------------------------------------
  // A JSON export of the exact data model (localStorage's contents) — the
  // same file can be loaded back in here, or on another computer/browser.

  function buildExportFile() {
    // Includes the time (not just the date) so two exports made on the same
    // day — e.g. one from a phone and one from a computer, then moved onto
    // the same machine — never land on the exact same filename. Same-day
    // date-only names made it easy to accidentally save a newer export
    // right over an older one (or vice versa) during a normal file
    // transfer, silently losing whichever one lost that naming collision.
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`
      + `_${pad(now.getHours())}${pad(now.getMinutes())}`;
    const filename = `family-tree-${stamp}.json`;
    const json = JSON.stringify(people, null, 2);
    return { filename, json };
  }

  // If this session already has a connected file (currentFileHandle —
  // from an earlier load or save), writes straight back to it: no
  // picker, no new file, just an in-place update. Otherwise prefers the
  // native "Save As" picker (Chrome/Edge desktop) so the person chooses
  // exactly where the file lands — and remembers that choice as the new
  // connected file for next time. Falls back to a plain download — which
  // just drops it in the browser's default downloads folder — on
  // browsers/platforms (Firefox, Safari, most mobile browsers) that don't
  // support the File System Access API at all.
  async function exportToFile() {
    const { filename, json } = buildExportFile();

    // A handle recovered from a previous session whose permission wasn't
    // confirmed yet — this click IS a real user gesture, so this is the
    // first place it's safe to actually ask for it.
    if (!currentFileHandle && pendingFileHandle) {
      try {
        const perm = await pendingFileHandle.requestPermission({ mode: "readwrite" });
        if (perm === "granted") currentFileHandle = pendingFileHandle;
      } catch { /* ignore — falls through to picking a file below */ }
      pendingFileHandle = null;
    }

    if (currentFileHandle) {
      try {
        const writable = await currentFileHandle.createWritable();
        await writable.write(json);
        await writable.close();
        flashSavedConfirmation();
        return;
      } catch {
        currentFileHandle = null; // handle went stale (file moved/deleted, permission revoked) — fall through and ask again
        clearPersistedFileHandle();
      }
    }

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(json);
        await writable.close();
        currentFileHandle = handle;
        persistFileHandle(handle);
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; // user cancelled the picker
        // any other error (e.g. unsupported in this context) — fall through to the download below
      }
    }

    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // Brief visual confirmation for the silent in-place save above — with
  // no OS "Save As" dialog to reassure the person something happened,
  // the button quickly says so itself instead.
  function flashSavedConfirmation() {
    const btn = document.getElementById("exportBtn");
    const original = btn.textContent;
    btn.textContent = t("savedConfirmation");
    setTimeout(() => { btn.textContent = original; }, 1200);
  }

  // Hands the file straight to the OS share sheet (AirDrop, Nearby Share,
  // Bluetooth, a messaging app, email...) so sending the tree to someone
  // else doesn't require a separate save-then-attach step. Only shown at
  // all when the browser can actually share files — support is mostly
  // phones (Android Chrome, iOS Safari); desktop browsers fall back to
  // the plain Save-to-file button instead, which stays visible.
  async function shareFile() {
    const { filename, json } = buildExportFile();
    const file = new File([json], filename, { type: "application/json" });
    try {
      await navigator.share({ files: [file], title: t("pageTitle") });
    } catch (err) {
      if (err && err.name === "AbortError") return; // the person themselves closed the share sheet — nothing to report
      // Sharing failed for some other reason (common on desktop: the OS
      // share sheet has no app registered for this file type, even
      // though canShare() said yes). By this point the click's own
      // user-activation may already be spent, so silently falling back
      // to exportToFile() here risks it skipping the "where to save"
      // picker and just dropping the file with no dialog at all — so
      // instead of that, or a blocking alert(), just a quiet flash on
      // the button itself: enough to say "that didn't work" without
      // interrupting anything.
      const btn = document.getElementById("shareBtn");
      const original = btn.textContent;
      btn.textContent = t("shareUnavailable");
      setTimeout(() => { btn.textContent = original; }, 1800);
    }
  }

  async function shareIsSupported() {
    if (!navigator.share || !navigator.canShare) return false;
    // canShare() only checks that the BROWSER is capable of sharing this
    // file type at all, not that this specific device actually has
    // anything registered to receive it — desktop Chrome routinely
    // answers "yes" here and then the share sheet itself has no
    // destination for a .json file, so the button would appear but never
    // work. Phones (Android Chrome, iOS Safari) reliably do have targets
    // (Messages, Mail, WhatsApp, AirDrop...) for an arbitrary file, so
    // this only shows the button on touch-primary ("no hover") devices —
    // the same signal hoverCapable() uses elsewhere to tell a phone from
    // a desktop/laptop.
    if (hoverCapable()) return false;
    try {
      const probe = new File(["x"], "probe.json", { type: "application/json" });
      return navigator.canShare({ files: [probe] });
    } catch {
      return false;
    }
  }

  // Resolves true only if the file's contents actually replaced the tree
  // (false for bad JSON, the wrong shape, or the person cancelling the
  // overwrite confirmation) — callers that connect this file for future
  // quick-saves (see currentFileHandle) need to know it actually took.
  function importFromFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        let imported;
        try {
          imported = JSON.parse(reader.result);
        } catch {
          alert(t("alertInvalidJson"));
          resolve(false);
          return;
        }
        if (!Array.isArray(imported) || !imported.every(p => p && typeof p.id === "string" && typeof p.name === "string")) {
          alert(t("alertWrongFormat"));
          resolve(false);
          return;
        }

        if (people.length > 0) {
          const currentIds = new Set(people.map(p => p.id));
          const added = imported.filter(p => !currentIds.has(p.id)).length;
          const updated = imported.length - added;
          const kept = people.length - updated;
          if (!confirm(t("confirmImport", { added, updated, kept }))) {
            resolve(false);
            return;
          }
        }

        // Merge by id rather than replacing outright: anyone from the file
        // who's new here gets added, anyone who already exists here gets
        // updated to match the file's version of them, and anyone who
        // exists here but ISN'T in the file is left alone. This is what
        // lets a correction made on one device and a new person added on
        // another both survive loading either file — a plain replace
        // would silently drop whichever side wasn't in the file just
        // opened (see the phone/computer mix-up this was built to fix).
        const importedIds = new Set(imported.map(p => p.id));
        people = people.filter(p => !importedIds.has(p.id)).concat(imported);

        if (editingId) cancelEdit(); // also resets the form/submit button out of "editing" state
        hidePersonInfo();
        save();
        render();
        resolve(true);
      };
      reader.onerror = () => { alert(t("alertReadError")); resolve(false); };
      reader.readAsText(file);
    });
  }

  // --- Generation layout -----------------------------------------------
  // Assigns each person a generation number (0 = oldest known ancestors),
  // groups people into "family units" (a person + their spouse, if any)
  // per generation, orders those units under their parents from the row
  // above, then lays out x/y pixel positions and the connector lines.

  // Two hard rules, both honored at once: a parent is always EXACTLY one
  // row above their own child, AND spouses always share a row. These can
  // conflict — e.g. one spouse's own ancestry runs one generation deeper
  // than the other's — but there's no contradiction in that: a root person
  // (no parents of their own) isn't actually pinned to row 0, so when their
  // descendant needs to match a deeper spouse, the fix is to push that
  // WHOLE shallower ancestor line down by the difference, not just the one
  // person. Every edge within that shifted line is still exactly 1 row,
  // and now the couple matches too.
  function computeGenerations() {
    const gen = {};
    for (const p of people) gen[p.id] = null;

    function propagate() {
      let changed = true;
      let guard = 0;
      while (changed && guard++ < people.length + 5) {
        changed = false;
        for (const p of people) {
          if (p.parents.length > 0) {
            const parentGens = p.parents.map(id => gen[id]).filter(g => g !== null && g !== undefined);
            if (parentGens.length > 0) {
              const target = Math.max(...parentGens) + 1;
              if (gen[p.id] !== target) { gen[p.id] = target; changed = true; }
              continue;
            }
          }
          if (gen[p.id] === null) { gen[p.id] = 0; changed = true; }
        }
      }
    }

    function ancestorsOf(personId) {
      const result = new Set();
      const stack = [personId];
      while (stack.length) {
        const current = byId(stack.pop());
        if (!current) continue;
        for (const pid of current.parents) {
          if (!result.has(pid)) { result.add(pid); stack.push(pid); }
        }
      }
      return result;
    }

    // When a spouse pair ends up at different depths, push the shallower
    // one's entire ancestor line down by the gap — re-propagating afterward
    // cascades that shift through their other descendants too, which can
    // in turn surface a new mismatch elsewhere, so this repeats until
    // nothing moves (or the guard trips on malformed/cyclic data).
    function stabilizeSpouseDepths() {
      let mismatched = true;
      let guard = 0;
      while (mismatched && guard++ < people.length + 5) {
        mismatched = false;
        for (const p of people) {
          const spouse = p.spouse && byId(p.spouse);
          if (!spouse || gen[p.id] === gen[spouse.id]) continue;
          const shallow = gen[p.id] < gen[spouse.id] ? p : spouse;
          const deficit = Math.abs(gen[p.id] - gen[spouse.id]);
          for (const id of [shallow.id, ...ancestorsOf(shallow.id)]) {
            if (typeof gen[id] === "number") gen[id] += deficit;
          }
          mismatched = true;
        }
        if (mismatched) propagate();
      }
    }

    propagate();
    stabilizeSpouseDepths();

    // A person with no known parents AND no spouse defaults to generation 0
    // (nothing above placed them) — but if they're actually a co-parent of
    // someone's children, that default is wrong: it strands them up among
    // an unrelated top generation instead of near the family they actually
    // belong to. Align them with the deepest co-parent they share a child
    // with, then re-propagate/re-stabilize so everything below and around
    // them settles back into the two rules above.
    let adjusted = true;
    let coParentGuard = 0;
    while (adjusted && coParentGuard++ < people.length + 5) {
      adjusted = false;
      for (const p of people) {
        if (p.parents.length > 0 || (p.spouse && byId(p.spouse))) continue;
        const coParentGens = [];
        for (const child of people) {
          if (!child.parents.includes(p.id)) continue;
          for (const coParentId of child.parents) {
            if (coParentId !== p.id && typeof gen[coParentId] === "number") coParentGens.push(gen[coParentId]);
          }
        }
        if (coParentGens.length === 0) continue;
        const target = Math.max(...coParentGens);
        if (gen[p.id] !== target) { gen[p.id] = target; adjusted = true; }
      }
      if (adjusted) {
        propagate();
        stabilizeSpouseDepths();
      }
    }

    // Absolute safety net: cap every generation at people.length. Nothing
    // in a valid (acyclic) tree can legitimately need more rows than there
    // are people, so if cyclic/malformed data slipped past the guards above
    // and pushed something higher, this just clamps the visual fallout
    // instead of producing a tree too tall to render sanely.
    for (const p of people) {
      if (typeof gen[p.id] === "number" && gen[p.id] > people.length) gen[p.id] = people.length;
    }
    return gen;
  }

  function buildFamilyUnits(gen) {
    const seen = new Set();
    const units = []; // { people: [person, spouse?], gen }
    for (const p of people) {
      if (seen.has(p.id)) continue;
      seen.add(p.id);
      const members = [p];
      // Only bundle a spouse into the same visual unit when they're
      // actually on the same row — generations are no longer forced to
      // match, so a spouse whose own line is deeper/shallower gets their
      // own unit on their own row instead (see computeGenerations).
      if (p.spouse && byId(p.spouse) && !seen.has(p.spouse) && gen[p.spouse] === gen[p.id]) {
        members.push(byId(p.spouse));
        seen.add(p.spouse);
      }
      units.push({ members, gen: gen[p.id] });
    }
    return units;
  }

  function layout() {
    const gen = computeGenerations();
    const units = buildFamilyUnits(gen);
    const maxGen = units.reduce((m, u) => Math.max(m, u.gen), 0);

    const rows = [];
    for (let g = 0; g <= maxGen; g++) rows.push(units.filter(u => u.gen === g));

    // Order each row by the average x of the unit's parents in the row above.
    const personX = new Map(); // person id -> center x

    rows.forEach((row, g) => {
      if (g === 0) {
        row.sort((a, b) => people.indexOf(a.members[0]) - people.indexOf(b.members[0]));
      } else {
        row.sort((a, b) => {
          const ax = avgParentX(a, personX), bx = avgParentX(b, personX);
          if (ax === null && bx === null) return people.indexOf(a.members[0]) - people.indexOf(b.members[0]);
          if (ax === null) return 1;
          if (bx === null) return -1;
          return ax - bx;
        });
      }

      pullCoParentsAdjacent(row);
      pullInLawsAdjacent(row);
      faceSiblingPairsInward(row);

      positionRow(row, personX);
    });

    // Position every unit in a row as close as possible to the average x of
    // its own parents (its "ideal" center) — keeping the row's given
    // left-to-right order and never overlapping — instead of a simple
    // forward pack. A forward-only pack can only push a unit right of its
    // ideal to avoid overlap, never left, so any earlier crowding in the
    // row permanently drags every sibling group after it off-center, and
    // that drift then compounds into the next generation. This uses the
    // standard "isotonic regression" (pool-adjacent-violators) solution to
    // "keep these points in order, as close as possible to their targets,
    // respecting minimum spacing": whenever two neighbors' ideal positions
    // conflict, they're merged into one block at their shared (weighted)
    // average and re-checked against the block before it, cascading as
    // needed. Units with no ideal of their own (no parents placed yet, and
    // no co-parent to anchor on either) exert no pull and simply sit
    // wherever their neighbors leave room.
    function positionRow(row, personX) {
      const n = row.length;
      if (n === 0) return;

      // Every PERSON in this row who has exactly two parents, and who is
      // one of exactly two such people sharing that same pair of parents,
      // gets their OWN ideal x overridden to land under ONE specific
      // parent — left sibling under whichever parent sits left, right
      // sibling under whichever sits right — instead of both averaging to
      // the midpoint between the parents. This runs at the PERSON level
      // (not per card-unit) so it still applies to someone who's married:
      // see the per-unit placement below, where a married pair can even
      // have BOTH partners qualify at once (two different sibling pairs
      // marrying each other) — the gap between spouses simply stretches
      // to let each of them land under their own parents.
      const personKey = (p) => p.parents.length === 2 ? [...p.parents].sort().join("|") : null;
      const keyCount = new Map();
      for (const u of row) for (const m of u.members) {
        const key = personKey(m);
        if (key !== null) keyCount.set(key, (keyCount.get(key) || 0) + 1);
      }
      const overrideX = new Map(); // person id -> overridden ideal x
      const leftAssignedKey = new Set(); // keys already given their "left" sibling
      for (const u of row) {
        for (const m of u.members) {
          const key = personKey(m);
          if (key === null || keyCount.get(key) !== 2) continue;
          const [pid1, pid2] = key.split("|");
          const x1 = personX.get(pid1), x2 = personX.get(pid2);
          if (x1 === undefined || x2 === undefined) continue;
          const leftParentX = Math.min(x1, x2), rightParentX = Math.max(x1, x2);
          if (leftAssignedKey.has(key)) {
            overrideX.set(m.id, rightParentX);
          } else {
            overrideX.set(m.id, leftParentX);
            leftAssignedKey.add(key);
          }
        }
      }

      // A person's own ideal x: the override above if they're one of a
      // sibling pair, else the average of their own recorded parents,
      // else null (no anchor of their own — e.g. married in, with no
      // ancestry entered).
      function personIdeal(p) {
        if (overrideX.has(p.id)) return overrideX.get(p.id);
        if (p.parents.length === 0) return null;
        const xs = p.parents.map(pid => personX.get(pid)).filter(x => x !== undefined);
        return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
      }

      const widths = new Array(n);
      const ideals = new Array(n);
      const plan = new Array(n); // how to turn this unit's resolved center back into member positions

      row.forEach((u, k) => {
        if (u.members.length === 1) {
          const t = personIdeal(u.members[0]);
          widths[k] = CARD_W;
          ideals[k] = t !== null ? t : avgParentX(u, personX);
          plan[k] = { kind: "lone" };
          return;
        }

        const [m0, m1] = u.members;
        const t0 = personIdeal(m0), t1 = personIdeal(m1);

        if (t0 !== null && t1 !== null) {
          // Dual anchor — both partners have their own parents to land
          // under, possibly in different places entirely. Stretch the
          // gap between them (never below the usual SPOUSE_GAP) so both
          // can land exactly on their own target at once.
          const leftIsM0 = t0 <= t1;
          const leftT = leftIsM0 ? t0 : t1, rightT = leftIsM0 ? t1 : t0;
          const gap = Math.max(SPOUSE_GAP, rightT - leftT - CARD_W);
          widths[k] = CARD_W * 2 + gap;
          ideals[k] = (leftT + rightT) / 2;
          plan[k] = { kind: "dual", leftIsM0, gap };
        } else if (t0 !== null || t1 !== null) {
          // One blood anchor, one spouse with no ancestry of their own —
          // shift the block's ideal by half its width so the symmetric
          // split below lands the anchor exactly on target and leaves
          // the spouse trailing off to whichever side is left.
          widths[k] = CARD_W * 2 + SPOUSE_GAP;
          const half = (CARD_W + SPOUSE_GAP) / 2;
          ideals[k] = (t0 !== null ? t0 : t1) + (t0 !== null ? half : -half);
          plan[k] = { kind: "split" };
        } else {
          // Neither partner has ancestry entered — fall back to the
          // co-parent heuristic for the pair as a whole, placed symmetric.
          widths[k] = CARD_W * 2 + SPOUSE_GAP;
          ideals[k] = avgParentX(u, personX);
          plan[k] = { kind: "split" };
        }
      });

      // Two paired lone-child siblings (assigned via overrideX above)
      // want to line up exactly under their own — often closely spaced —
      // parents. The default UNIT_GAP between neighboring cards is wider
      // than that needs to be, so it's narrowed to SPOUSE_GAP for that
      // one adjacent pair, same as the parents' own spacing.
      const gaps = new Array(Math.max(n - 1, 0)).fill(UNIT_GAP);
      for (let k = 0; k < n - 1; k++) {
        if (plan[k].kind !== "lone" || plan[k + 1].kind !== "lone") continue;
        const a = row[k].members[0], b = row[k + 1].members[0];
        const key = personKey(a);
        if (key !== null && key === personKey(b) && overrideX.has(a.id) && overrideX.has(b.id)) {
          gaps[k] = SPOUSE_GAP;
        }
      }

      const offset = new Array(n);
      let cum = 0;
      for (let k = 0; k < n; k++) {
        offset[k] = cum;
        cum += widths[k] + (gaps[k] ?? UNIT_GAP);
      }
      // y[k] is this unit's desired left edge relative to a tight forward
      // pack starting at 0 — zero (no pull either way) for a unit with no
      // ideal of its own.
      const y = row.map((u, k) => ideals[k] === null ? 0 : (ideals[k] - widths[k] / 2) - offset[k]);

      const blocks = []; // stack of {value, weight}, weight = number of units pooled in
      for (let k = 0; k < n; k++) {
        let block = { value: y[k], weight: 1 };
        blocks.push(block);
        while (blocks.length > 1 && blocks[blocks.length - 2].value > block.value) {
          const b2 = blocks.pop();
          const b1 = blocks.pop();
          block = {
            value: (b1.value * b1.weight + b2.value * b2.weight) / (b1.weight + b2.weight),
            weight: b1.weight + b2.weight,
          };
          blocks.push(block);
        }
      }

      const z = new Array(n);
      let idx = 0;
      for (const b of blocks) {
        for (let c = 0; c < b.weight; c++) { z[idx] = b.value; idx++; }
      }

      row.forEach((unit, k) => {
        const centerX = z[k] + offset[k] + widths[k] / 2;
        if (unit.members.length === 1) {
          personX.set(unit.members[0].id, centerX);
          return;
        }
        const [m0, m1] = unit.members;
        if (plan[k].kind === "dual") {
          const halfGap = plan[k].gap / 2;
          const leftX = centerX - CARD_W / 2 - halfGap;
          const rightX = centerX + CARD_W / 2 + halfGap;
          personX.set((plan[k].leftIsM0 ? m0 : m1).id, leftX);
          personX.set((plan[k].leftIsM0 ? m1 : m0).id, rightX);
        } else {
          const half = (CARD_W + SPOUSE_GAP) / 2;
          personX.set(m0.id, centerX - half);
          personX.set(m1.id, centerX + half);
        }
      });
    }

    // Rows were placed independently and can each drift into negative x
    // (see above) — normalize by shifting every row by the same amount so
    // the leftmost card lands at x = 0. A single shared shift (rather than
    // one computed per row) is what keeps the parent/child alignment the
    // loop above just computed intact.
    let minX = Infinity, maxX = -Infinity;
    for (const x of personX.values()) {
      minX = Math.min(minX, x - CARD_W / 2);
      maxX = Math.max(maxX, x + CARD_W / 2);
    }
    if (!isFinite(minX)) { minX = 0; maxX = 0; }
    const shift = -minX;
    for (const [id, x] of personX) personX.set(id, x + shift);
    const totalWidth = Math.max(maxX - minX, 400);

    // A unit with no ancestry of its own (e.g. someone added only as a
    // co-parent, no family entered for them) sorts wherever avgParentX(=null)
    // happens to leave it — often the far end of the row. When their actual
    // co-parent is in this same row, splice them to sit right next to that
    // co-parent's unit instead, so the connector down to their shared child
    // is a short line between neighbors rather than a long one stretching
    // across everyone in between.
    function pullCoParentsAdjacent(row) {
      for (let i = row.length - 1; i >= 0; i--) {
        const unit = row[i];
        if (unit.members.some(m => m.parents.length > 0)) continue;

        let partnerUnit = null;
        for (const m of unit.members) {
          for (const child of people) {
            if (!child.parents.includes(m.id)) continue;
            for (const coParentId of child.parents) {
              if (coParentId === m.id) continue;
              const found = row.find(u => u !== unit && u.members.some(mm => mm.id === coParentId));
              if (found) { partnerUnit = found; break; }
            }
            if (partnerUnit) break;
          }
          if (partnerUnit) break;
        }
        if (!partnerUnit) continue;

        row.splice(i, 1);
        const partnerIndex = row.indexOf(partnerUnit);
        row.splice(partnerIndex + 1, 0, unit);
      }
    }

    // When someone in this row has a child who married into another
    // family, pull that other family's unit (the in-laws — the spouse's
    // own parents) up next to this one. Otherwise two families connected
    // only by a marriage one row down can land on opposite sides of an
    // unrelated third unit, with no visual hint they're related at all.
    function pullInLawsAdjacent(row) {
      for (let i = row.length - 1; i >= 0; i--) {
        const unit = row[i];
        let partnerUnit = null;
        outer:
        for (const m of unit.members) {
          for (const child of people) {
            if (!child.parents.includes(m.id) || !child.spouse) continue;
            const childSpouse = byId(child.spouse);
            if (!childSpouse) continue;
            for (const inLawId of childSpouse.parents) {
              const found = row.find(u => u !== unit && u.members.some(mm => mm.id === inLawId));
              if (found) { partnerUnit = found; break outer; }
            }
          }
        }
        if (!partnerUnit) continue;

        const unitIndex = row.indexOf(unit);
        const partnerIndex2 = row.indexOf(partnerUnit);
        if (Math.abs(unitIndex - partnerIndex2) === 1) continue; // already adjacent
        row.splice(unitIndex, 1);
        row.splice(row.indexOf(partnerUnit) + 1, 0, unit);
      }
    }

    // When two units end up next to each other and each is a sibling +
    // their spouse — and those two siblings are their parents' ONLY two
    // children — flip each unit so the siblings face each other in the
    // middle and their spouses sit on the outside, instead of a spouse
    // ending up sandwiched between the two blood siblings.
    function faceSiblingPairsInward(row) {
      for (let i = 0; i < row.length - 1; i++) {
        const unitA = row[i], unitB = row[i + 1];
        if (unitA.members.length !== 2 || unitB.members.length !== 2) continue;

        outer:
        for (const a of unitA.members) {
          if (a.parents.length === 0) continue;
          const aKey = [...a.parents].sort().join("|");
          for (const b of unitB.members) {
            if (b.parents.length === 0 || a === b) continue;
            const bKey = [...b.parents].sort().join("|");
            if (aKey !== bKey) continue;
            const siblingCount = people.filter(c => [...c.parents].sort().join("|") === aKey).length;
            if (siblingCount !== 2) continue;
            if (unitA.members[1] !== a) unitA.members.reverse();
            if (unitB.members[0] !== b) unitB.members.reverse();
            break outer;
          }
        }
      }
    }

    // For a married couple sharing a unit, only ONE of the two is usually
    // the actual blood relative in this family line — the other married
    // in and (typically) has no ancestry of their own entered. Picks out
    // that one member's index (0 or 1) so ideal-x calculations can anchor
    // on the child's own parents instead of blending in the spouse's
    // unrelated family. Returns 0 for a lone (unmarried) unit — trivially
    // its only member — and null when it's ambiguous (both members have
    // parents entered, e.g. cousins who married each other, or neither
    // does), in which case callers fall back to treating the whole unit
    // as one blended blob, same as before this distinction existed.
    function unitAnchorIndex(unit) {
      if (unit.members.length === 1) return 0;
      const withParents = unit.members.map((m, i) => m.parents.length > 0 ? i : -1).filter(i => i !== -1);
      return withParents.length === 1 ? withParents[0] : null;
    }

    function avgParentX(unit, personX) {
      const anchorIdx = unitAnchorIndex(unit);
      const anchorMembers = anchorIdx !== null ? [unit.members[anchorIdx]] : unit.members;
      const parentIds = new Set();
      for (const m of anchorMembers) for (const pid of m.parents) parentIds.add(pid);
      let xs = [...parentIds].map(id => personX.get(id)).filter(x => x !== undefined);
      if (xs.length === 0) {
        // No parents of their own to anchor on — e.g. someone added only as
        // a co-parent, with no ancestry entered for them. Sort them next to
        // whoever they actually share a child with instead, so they land
        // beside that person rather than drifting to the end of the row
        // (which otherwise sends their connector line stretching sideways
        // across unrelated cards in between).
        const coParentIds = new Set();
        for (const m of unit.members) {
          for (const child of people) {
            if (!child.parents.includes(m.id)) continue;
            for (const cid of child.parents) if (cid !== m.id) coParentIds.add(cid);
          }
        }
        xs = [...coParentIds].map(id => personX.get(id)).filter(x => x !== undefined);
      }
      return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
    }

    const positions = {};
    people.forEach(p => {
      const x = personX.get(p.id) ?? 0;
      const y = gen[p.id] * ROW_H + 20;
      positions[p.id] = { x, y };
    });

    return { positions, width: totalWidth, height: (maxGen + 1) * ROW_H + CARD_H + 20 };
  }

  // --- Rendering ---------------------------------------------------------

  // A quick at-a-glance summary of the tree's size — handy once it's grown
  // past what's obvious from a single screenful of cards.
  function updateTreeStats() {
    const el = document.getElementById("treeStats");
    if (people.length === 0) { el.hidden = true; return; }
    el.hidden = false;

    const genCount = new Set(Object.values(computeGenerations())).size;
    const peopleLabel = people.length === 1 ? t("statPeopleOne") : t("statPeopleMany", { n: people.length });
    const genLabel = genCount === 1 ? t("statGenOne") : t("statGenMany", { n: genCount });
    const parts = [peopleLabel, genLabel];

    let oldest = null, youngest = null;
    for (const p of people) {
      const age = calculateAge(p.birth, p.death);
      if (age === null) continue;
      if (!oldest || age > oldest.age) oldest = { p, age };
      if (!youngest || age < youngest.age) youngest = { p, age };
    }
    if (oldest) parts.push(t("statOldest", { name: oldest.p.name, age: oldest.age }));
    if (youngest && youngest.p.id !== oldest.p.id) parts.push(t("statYoungest", { name: youngest.p.name, age: youngest.age }));

    el.textContent = parts.join(" · ");
  }

  function render() {
    refreshDropdowns();
    refreshRelSelects();
    updateTreeStats();

    const wrap = document.getElementById("treeInner");
    const emptyHint = document.getElementById("emptyHint");
    wrap.innerHTML = "";

    if (people.length === 0) {
      emptyHint.style.display = "block";
      wrap.style.width = "0px";
      wrap.style.height = "0px";
      document.getElementById("treeZoomSpacer").style.width = "0px";
      document.getElementById("treeZoomSpacer").style.height = "0px";
      return;
    }
    emptyHint.style.display = "none";

    const { positions, width, height } = layout();

    // Center the whole tree as a single block within the visible area.
    // layout() already centers each child (or sibling group) under its own
    // parents using a shared, tree-wide set of x-coordinates — re-centering
    // each generation row independently on top of that (as this used to do)
    // would undo that alignment any time a row's own content happens to be
    // narrower or wider than another row's, which is most of the time.
    // Divide by zoom first — clientWidth is the on-screen (already-scaled)
    // viewport, but this math all happens in the tree's own unscaled
    // coordinate space.
    const availableWidth = (document.getElementById("treeWrap").clientWidth / zoomLevel) || width;
    const offsetX = Math.max(0, Math.round((availableWidth - width) / 2));
    let maxRight = 0;
    for (const id in positions) {
      const pos = positions[id];
      pos.x += offsetX;
      maxRight = Math.max(maxRight, pos.x + CARD_W / 2);
    }

    const wrapWidth = Math.max(maxRight, availableWidth);
    wrap.style.width = wrapWidth + "px";
    wrap.style.height = height + "px";
    lastLayoutWidth = wrapWidth;
    lastLayoutHeight = height;

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    // Must match wrap's width, not the pre-centering layout width — an SVG
    // clips anything past its own width/height by default, and centering
    // shifts every card (and line) right by offsetX without widening the
    // original layout width, so a narrower SVG here silently clips lines to
    // cards on the right side of a centered tree.
    svg.setAttribute("width", wrapWidth);
    svg.setAttribute("height", height);
    svg.style.position = "absolute";
    svg.style.left = "0";
    svg.style.top = "0";
    svg.style.pointerEvents = "none";

    // peopleIds tags the line with who it connects — read back later to
    // highlight just one person's own connections on hover/tap instead of
    // fixed per-family colors, which run out of visually distinct options
    // once a tree has more than a handful of family branches.
    function line(x1, y1, x2, y2, color, peopleIds) {
      const el = document.createElementNS(svgNS, "line");
      el.setAttribute("x1", x1); el.setAttribute("y1", y1);
      el.setAttribute("x2", x2); el.setAttribute("y2", y2);
      el.setAttribute("stroke", color);
      el.setAttribute("stroke-width", "1.6");
      el.style.transition = "opacity 0.15s ease";
      if (peopleIds) el.setAttribute("data-people", peopleIds.join(" "));
      svg.appendChild(el);
    }

    // Spouse connectors.
    const drawnSpousePairs = new Set();
    for (const p of people) {
      if (p.spouse && byId(p.spouse)) {
        const key = [p.id, p.spouse].sort().join("|");
        if (drawnSpousePairs.has(key)) continue;
        drawnSpousePairs.add(key);
        const a = positions[p.id], b = positions[p.spouse];
        const spouseColor = theme === "light" ? "rgba(179,114,28,0.55)" : "rgba(232,176,75,0.5)";
        line(a.x, a.y + CARD_H / 2, b.x, b.y + CARD_H / 2, spouseColor, [p.id, p.spouse]);
      }
    }

    // Parent-child connectors. Each parent gets its own stub dropping from
    // the bottom of its card down to a shared horizontal bus — so with two
    // parents the line visibly comes from both of them, and with only one
    // parent specified it's just a single line from that one. Each distinct
    // parent-set gets its own stable color (see familyLineColor) so two
    // nearby/crossing family lines stay visually distinguishable even
    // without hovering.
    for (const p of people) {
      if (p.parents.length === 0) continue;
      const validParents = p.parents.filter(id => positions[id]);
      if (validParents.length === 0) continue;
      const parentXs = validParents.map(id => positions[id].x);
      const parentBottoms = validParents.map(id => positions[id].y + CARD_H);
      const busY = Math.max(...parentBottoms) + 14;
      const originX = parentXs.reduce((a, b) => a + b, 0) / parentXs.length;
      const connectedIds = [p.id, ...validParents];
      const familyColor = familyLineColor(validParents);

      // Each parent's stub starts at ITS OWN card bottom, not a shared one —
      // parents can sit in different generations (e.g. one has ancestors of
      // their own and one doesn't), so their card bottoms aren't always at
      // the same y. Using one shared y here left the shallower parent's line
      // floating below their card instead of touching it.
      parentXs.forEach((x, i) => {
        line(x, parentBottoms[i], x, busY, familyColor, connectedIds);
      });
      const minX = Math.min(...parentXs), maxX = Math.max(...parentXs);
      if (minX !== maxX) line(minX, busY, maxX, busY, familyColor, connectedIds);

      const childPos = positions[p.id];
      const midY = originX === childPos.x ? busY : (busY + childPos.y) / 2;
      line(originX, busY, originX, midY, familyColor, connectedIds);
      line(originX, midY, childPos.x, midY, familyColor, connectedIds);
      line(childPos.x, midY, childPos.x, childPos.y, familyColor, connectedIds);
    }

    wrap.appendChild(svg);

    for (const p of people) {
      const pos = positions[p.id];
      const el = document.createElement("div");
      el.className = "person" + (p.id === editingId ? " editing" : "");
      el.dataset.personId = p.id;
      el.style.left = (pos.x - CARD_W / 2) + "px";
      el.style.top = pos.y + "px";
      const bornText = formatDate(p.birth) || "—";
      const deathText = formatDate(p.death);
      const dates = deathText ? `${bornText} – ${deathText}` : bornText;
      const age = calculateAge(p.birth, p.death);
      const ageLabel = age === null ? "" : t(p.death ? "agedX" : "ageX", { age });
      const rawFocus = p.photoFocus || { x: 50, y: 50 };
      const clampPct = (v) => Number.isFinite(+v) ? Math.max(0, Math.min(100, +v)) : 50;
      const focus = { x: clampPct(rawFocus.x), y: clampPct(rawFocus.y) };
      const photoHtml = p.photo
        ? `<img class="photo" src="${escapeHtml(p.photo)}" style="object-position:${focus.x}% ${focus.y}%" alt="">`
        : `<div class="photo-placeholder">${escapeHtml((p.name.trim().charAt(0) || "?").toUpperCase())}</div>`;
      const childCount = people.filter(c => c.parents.includes(p.id)).length;
      const childrenLabel = childCount === 0 ? "" : t(childCount === 1 ? "oneChild" : "manyChildren", { n: childCount });
      el.innerHTML = `
        ${photoHtml}
        <div class="name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
        ${p.origin ? `<div class="origin" title="${escapeHtml(p.origin)}">${escapeHtml(p.origin)}</div>` : ""}
        <div class="dates">${escapeHtml(dates)}</div>
        ${ageLabel ? `<div class="age">${escapeHtml(ageLabel)}</div>` : ""}
        <div class="edit-hint">${escapeHtml(t("editHint"))}</div>
        ${childrenLabel ? `<div class="children-count">${escapeHtml(childrenLabel)}</div>` : ""}
        <button class="del" title="${escapeHtml(t("removePerson", { name: p.name }))}" type="button">×</button>
      `;
      el.querySelector(".del").addEventListener("click", (e) => {
        e.stopPropagation();
        if (confirm(t("confirmDelete", { name: p.name }))) deletePerson(p.id);
      });

      // The card's own photo is small and cropped to the chosen face-focus
      // point — clicking it opens the original photo full-size and
      // uncropped, with no focus-marker circle (that's only relevant while
      // choosing the focus point in the add/edit form).
      if (p.photo) {
        el.querySelector(".photo").addEventListener("click", (e) => {
          e.stopPropagation();
          openPhotoLightbox(p.photo);
        });
      }

      // Desktop: hovering reveals the full info popup passively, and a
      // click still jumps straight into editing. Touch devices have no
      // hover, so a tap shows the info popup instead (with its own Edit
      // button inside it) rather than opening editing on a single tap.
      if (hoverCapable()) {
        el.addEventListener("mouseenter", () => { cancelHidePersonInfo(); showPersonInfo(p.id, el); });
        el.addEventListener("mouseleave", scheduleHidePersonInfo);
        el.addEventListener("click", () => startEdit(p.id));
      } else {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          showPersonInfo(p.id, el);
        });
      }
      wrap.appendChild(el);
    }

    applyZoom();
    reapplySearchHighlight();
    reapplyRelationshipHighlight();
  }

  // --- Photo lightbox ------------------------------------------------

  function openPhotoLightbox(src) {
    document.getElementById("photoLightboxImg").src = src;
    document.getElementById("photoLightbox").hidden = false;
  }
  function closePhotoLightbox() {
    document.getElementById("photoLightbox").hidden = true;
    document.getElementById("photoLightboxImg").src = "";
  }
  document.getElementById("photoLightboxClose").addEventListener("click", closePhotoLightbox);
  document.getElementById("photoLightbox").addEventListener("click", (e) => {
    if (e.target.id === "photoLightbox") closePhotoLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !document.getElementById("photoLightbox").hidden) closePhotoLightbox();
  });

  // --- Zoom controls -------------------------------------------------
  // A CSS transform on #treeInner, visually scaling it, while
  // #treeZoomSpacer is sized to match (width/height × zoom) so #treeWrap's
  // own scrolling — which only knows about unscaled layout sizes — still
  // reaches exactly the scaled content's edges instead of clipping it (zoom
  // in) or leaving dead scroll space (zoom out).

  let zoomLevel = 1;
  let lastLayoutWidth = 0, lastLayoutHeight = 0;
  const ZOOM_MIN = 0.15, ZOOM_MAX = 3;

  function applyZoom() {
    const spacer = document.getElementById("treeZoomSpacer");
    spacer.style.width = (lastLayoutWidth * zoomLevel) + "px";
    spacer.style.height = (lastLayoutHeight * zoomLevel) + "px";
    document.getElementById("treeInner").style.transform = `scale(${zoomLevel})`;
  }

  // Zoom around the center of the viewport rather than its top-left corner
  // (#treeInner's transform-origin) — otherwise whatever happened to be
  // pinned at the origin stays put and everything else visibly drifts
  // away from it as the scale changes. Whatever tree-coordinate point is
  // currently centered in the visible area is recomputed from the
  // pre-zoom scroll position, then the scroll position is adjusted after
  // the new scale is applied so that same point ends up centered again.
  function setZoom(next) {
    const treeWrap = document.getElementById("treeWrap");
    const viewportW = treeWrap.clientWidth, viewportH = treeWrap.clientHeight;
    const oldZoom = zoomLevel;
    const centerX = (treeWrap.scrollLeft + viewportW / 2) / oldZoom;
    const centerY = (treeWrap.scrollTop + viewportH / 2) / oldZoom;

    zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
    applyZoom();

    treeWrap.scrollLeft = centerX * zoomLevel - viewportW / 2;
    treeWrap.scrollTop = centerY * zoomLevel - viewportH / 2;
  }

  document.getElementById("zoomInBtn").addEventListener("click", () => setZoom(zoomLevel * 1.25));
  document.getElementById("zoomOutBtn").addEventListener("click", () => setZoom(zoomLevel / 1.25));

  document.getElementById("zoomFitBtn").addEventListener("click", () => {
    const treeWrap = document.getElementById("treeWrap");
    if (!lastLayoutWidth || !lastLayoutHeight) { setZoom(1); return; }
    const fitScale = Math.min(
      treeWrap.clientWidth / lastLayoutWidth,
      treeWrap.clientHeight / lastLayoutHeight,
      1 // never zoom past 100% just because the tree happens to be small
    );
    // Toggle: pressing it again while already at the fitted scale goes back
    // to 100% instead of recomputing the same fit over and over.
    const alreadyFitted = Math.abs(zoomLevel - fitScale) < 0.01;
    setZoom(alreadyFitted ? 1 : fitScale);
    treeWrap.scrollTo({ top: 0, left: 0 });
    render(); // re-centers rows for the new effective available width at this zoom
  });

  // Ctrl/Cmd+wheel zooms (matches the browser's own page-zoom gesture)
  // instead of scrolling, so a trackpad pinch or Ctrl+scroll over the tree
  // does the expected thing rather than scrolling the page underneath it.
  document.getElementById("treeWrap").addEventListener("wheel", (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(zoomLevel * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });

  // --- Search ----------------------------------------------------------
  // Finds people by name and scrolls/zooms-view to center on a match —
  // handy once the tree has enough people that scanning for one by eye
  // gets tedious. Re-run automatically after every render() (see
  // reapplySearchHighlight) since render() rebuilds every .person element
  // from scratch each time, which would otherwise silently drop the
  // highlight the moment anything else in the tree changes.

  let searchMatchIds = [];
  let searchCurrent = -1;

  function runSearch(query) {
    const q = query.trim().toLowerCase();
    document.getElementById("personSearchClear").hidden = q === "";

    if (q === "") {
      searchMatchIds = [];
      searchCurrent = -1;
      clearSearchHighlight();
      document.getElementById("personSearchCount").hidden = true;
      return;
    }

    searchMatchIds = people.filter(p => p.name.toLowerCase().includes(q)).map(p => p.id);
    searchCurrent = searchMatchIds.length ? 0 : -1;
    applySearchHighlight(true);
  }

  function clearSearchHighlight() {
    document.querySelectorAll(".person.search-match, .person.search-current")
      .forEach(el => el.classList.remove("search-match", "search-current"));
  }

  // scrollToCurrent is false for a passive resync (reapplySearchHighlight,
  // run after every render — including ones that have nothing to do with
  // the search) so it doesn't yank the view back to the current match
  // just because something unrelated changed; true for anything the
  // person did on purpose (typing, pressing Enter).
  function applySearchHighlight(scrollToCurrent) {
    clearSearchHighlight();
    const countEl = document.getElementById("personSearchCount");
    if (searchMatchIds.length === 0) {
      countEl.hidden = false;
      countEl.textContent = t("searchNoMatches");
      return;
    }
    countEl.hidden = false;
    countEl.textContent = `${searchCurrent + 1}/${searchMatchIds.length}`;
    searchMatchIds.forEach((id, i) => {
      const el = document.querySelector(`.person[data-person-id="${id}"]`);
      if (el) el.classList.add(i === searchCurrent ? "search-current" : "search-match");
    });
    if (!scrollToCurrent) return;
    const currentEl = document.querySelector(`.person[data-person-id="${searchMatchIds[searchCurrent]}"]`);
    if (currentEl) currentEl.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
  }

  // Re-runs the CURRENT search query against the live (possibly just
  // edited) people list — called at the end of render() so a search
  // stays accurate across edits (a newly added or renamed person can
  // join the results) instead of silently going stale, but without
  // forcing the view to jump back to the current match every time.
  function reapplySearchHighlight() {
    const input = document.getElementById("personSearch");
    if (!input || input.value.trim() === "") return;
    const currentId = searchMatchIds[searchCurrent];
    const q = input.value.trim().toLowerCase();
    searchMatchIds = people.filter(p => p.name.toLowerCase().includes(q)).map(p => p.id);
    const idx = searchMatchIds.indexOf(currentId);
    searchCurrent = idx !== -1 ? idx : (searchMatchIds.length ? 0 : -1);
    applySearchHighlight(false);
  }

  function advanceSearchMatch(delta) {
    if (searchMatchIds.length === 0) return;
    searchCurrent = (searchCurrent + delta + searchMatchIds.length) % searchMatchIds.length;
    applySearchHighlight(true);
  }

  const personSearchInput = document.getElementById("personSearch");
  personSearchInput.addEventListener("input", () => runSearch(personSearchInput.value));
  personSearchInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    advanceSearchMatch(e.shiftKey ? -1 : 1);
  });
  document.getElementById("personSearchClear").addEventListener("click", () => {
    personSearchInput.value = "";
    runSearch("");
    personSearchInput.focus();
  });

  // --- Relationship finder -----------------------------------------------
  // Picks two people and highlights the shortest connecting path (through
